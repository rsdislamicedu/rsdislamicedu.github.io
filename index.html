 ["أَمۡ يَقُولُونَ ٱفۡتَرَىٰهُۚ بَلۡ هُوَ ٱلۡحَقُّ مِن رَّبِّكَ لِتُنذِرَ قَوۡمٗا مَّآ أَتَىٰهُم مِّن نَّذِيرٖ مِّن قَبۡلِكَ لَعَلَّهُمۡ يَهۡتَدُونَ", "Or do they say, \"He invented it\"? Rather, it is the truth from your Lord, [O Muhammad], that you may warn a people to whom no warner has come before you [so] perhaps they will be guided"], ["ٱللَّهُ ٱلَّذِي خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضَ وَمَا بَيۡنَهُمَا فِي سِتَّةِ أَيَّامٖ ثُمَّ ٱسۡتَوَىٰ عَلَى ٱلۡعَرۡشِۖ مَا لَكُم مِّن دُونِهِۦ مِن وَلِيّٖ وَلَا شَفِيعٍۚ أَفَلَا تَتَذَكَّرُونَ", "It is Allah who created the heavens and the earth and whatever is between them in six days; then He established Himself above the Throne. You have not besides Him any protector or any intercessor; so will you not be reminded"], ["يُدَبِّرُ ٱلۡأَمۡرَ مِنَ ٱلسَّمَآءِ إِلَى ٱلۡأَرۡضِ ثُمَّ يَعۡرُجُ إِلَيۡهِ فِي يَوۡمٖ كَانَ مِقۡدَارُهُۥٓ أَلۡفَ سَنَةٖ مِّمَّا تَعُدُّونَ", "He arranges [each] matter from the heaven to the earth; then it will ascend to Him in a Day, the extent of which is a thousand years of those which you count"], ["ذَٰلِكَ عَٰلِمُ ٱلۡغَيۡبِ وَٱلشَّهَٰدَةِ ٱلۡعَزِيزُ ٱلرَّحِيمُ", "That is the Knower of the unseen and the witnessed, the Exalted in Might, the Merciful"], ["ٱلَّذِيٓ أَحۡسَنَ كُلَّ شَيۡءٍ خَلَقَهُۥۖ وَبَدَأَ خَلۡقَ ٱلۡإِنسَٰنِ مِن طِينٖ", "Who perfected everything which He created and began the creation of man from clay"], ["ثُمَّ جَعَلَ نَسۡلَهُۥ مِن سُلَٰلَةٖ مِّن مَّآءٖ مَّهِينٖ", "Then He made his posterity out of the extract of a liquid disdained"], ["ثُمَّ سَوَّىٰهُ وَنَفَخَ فِيهِ مِن رُّوحِهِۦۖ وَجَعَلَ لَكُمُ ٱلسَّمۡعَ وَٱلۡأَبۡصَٰرَ وَٱلۡأَفۡـِٔدَةَۚ قَلِيلٗا مَّا تَشۡكُرُونَ", "Then He proportioned him and breathed into him from His [created] soul and made for you hearing and vision and hearts; little are you grateful"], ["وَقَالُوٓاْ أَءِذَا ضَلَلۡنَا فِي ٱلۡأَرۡضِ أَءِنَّا لَفِي خَلۡقٖ جَدِيدِۭۚ بَلۡ هُم بِلِقَآءِ رَبِّهِمۡ كَٰفِرُونَ", "And they say, \"When we are lost within the earth, will we indeed be [recreated] in a new creation?\" Rather, they are, in [the matter of] the meeting with their Lord, disbelievers"], ["۞قُلۡ يَتَوَفَّىٰكُم مَّلَكُ ٱلۡمَوۡتِ ٱلَّذِي وُكِّلَ بِكُمۡ ثُمَّ إِلَىٰ رَبِّكُمۡ تُرۡجَعُونَ", "Say, \"The angel of death will take you who has been entrusted with you. Then to your Lord you will be returned"], ["وَلَوۡ تَرَىٰٓ إِذِ ٱلۡمُجۡرِمُونَ نَاكِسُواْ رُءُوسِهِمۡ عِندَ رَبِّهِمۡ رَبَّنَآ أَبۡصَرۡنَا وَسَمِعۡنَا فَٱرۡجِعۡنَا نَعۡمَلۡ صَٰلِحًا إِنَّا مُوقِنُونَ", "If you could but see when the criminals are hanging their heads before their Lord, [saying], \"Our Lord, we have seen and heard, so return us [to the world]; we will work righteousness. Indeed, we are [now] certain"]]}], "8": [{"n": 50, "ar": "ق", "en": "Qaf", "from": 1, "to": 15, "v": [["قٓۚ وَٱلۡقُرۡءَانِ ٱلۡمَجِيدِ", "Qaf. By the honored Qur'an"], ["بَلۡ عَجِبُوٓاْ أَن جَآءَهُم مُّنذِرࣱ مِّنۡهُمۡ فَقَالَ ٱلۡكَٰفِرُونَ هَٰذَا شَيۡءٌ عَجِيبٌ", "But they wonder that there has come to them a warner from among themselves, and the disbelievers say, \"This is an amazing thing"], ["أَءِذَا مِتۡنَا وَكُنَّا تُرَابٗاۖ ذَٰلِكَ رَجۡعُۢ بَعِيدࣱ", "When we have died and have become dust, [we will return to life]? That is a distant return"], ["قَدۡ عَلِمۡنَا مَا تَنقُصُ ٱلۡأَرۡضُ مِنۡهُمۡۖ وَعِندَنَا كِتَٰبٌ حَفِيظُۢ", "We know what the earth diminishes of them, and with Us is a retaining record"], ["بَلۡ كَذَّبُواْ بِٱلۡحَقِّ لَمَّا جَآءَهُمۡ فَهُمۡ فِيٓ أَمۡرٖ مَّرِيجٍ", "But they denied the truth when it came to them, so they are in a confused condition"], ["أَفَلَمۡ يَنظُرُوٓاْ إِلَى ٱلسَّمَآءِ فَوۡقَهُمۡ كَيۡفَ بَنَيۡنَٰهَا وَزَيَّنَّـٰهَا وَمَا لَهَا مِن فُرُوجٖ", "Have they not looked at the heaven above them - how We structured it and adorned it and [how] it has no rifts"], ["وَٱلۡأَرۡضَ مَدَدۡنَٰهَا وَأَلۡقَيۡنَا فِيهَا رَوَٰسِيَ وَأَنۢبَتۡنَا فِيهَا مِن كُلِّ زَوۡجِۭ بَهِيجٖ", "And the earth - We spread it out and cast therein firmly set mountains and made grow therein [something] of every beautiful kind"], ["تَبۡصِرَةٗ وَذِكۡرَىٰ لِكُلِّ عَبۡدٖ مُّنِيبٖ", "Giving insight and a reminder for every servant who turns [to Allah]"], ["وَنَزَّلۡنَا مِنَ ٱلسَّمَآءِ مَآءٗ مُّبَٰرَكٗا فَأَنۢبَتۡنَا بِهِۦ جَنَّـٰتٖ وَحَبَّ ٱلۡحَصِيدِ", "And We have sent down blessed rain from the sky and made grow thereby gardens and grain from the harvest"], ["وَٱلنَّخۡلَ بَاسِقَٰتٖ لَّهَا طَلۡعࣱ نَّضِيدࣱ", "And lofty palm trees having fruit arranged in layers"], ["رِّزۡقٗا لِّلۡعِبَادِۖ وَأَحۡيَيۡنَا بِهِۦ بَلۡدَةٗ مَّيۡتٗاۚ كَذَٰلِكَ ٱلۡخُرُوجُ", "As provision for the servants, and We have given life thereby to a dead land. Thus is the resurrection"], ["كَذَّبَتۡ قَبۡلَهُمۡ قَوۡمُ نُوحٖ وَأَصۡحَٰبُ ٱلرَّسِّ وَثَمُودُ", "The people of Noah denied before them, and the companions of the well and Thamud"], ["وَعَادࣱ وَفِرۡعَوۡنُ وَإِخۡوَٰنُ لُوطٖ", "And 'Aad and Pharaoh and the brothers of Lot"], ["وَأَصۡحَٰبُ ٱلۡأَيۡكَةِ وَقَوۡمُ تُبَّعٖۚ كُلࣱّ كَذَّبَ ٱلرُّسُلَ فَحَقَّ وَعِيدِ", "And the companions of the thicket and the people of Tubba'. All denied the messengers, so My threat was justly fulfilled"], ["أَفَعَيِينَا بِٱلۡخَلۡقِ ٱلۡأَوَّلِۚ بَلۡ هُمۡ فِي لَبۡسٖ مِّنۡ خَلۡقٖ جَدِيدٖ", "Did We fail in the first creation? But they are in confusion over a new creation"]]}], "9": [{"n": 36, "ar": "يس", "en": "Ya-Sin", "from": 1, "to": 12, "v": [["يسٓ", "Ya, Seen"], ["وَٱلۡقُرۡءَانِ ٱلۡحَكِيمِ", "By the wise Qur'an"], ["إِنَّكَ لَمِنَ ٱلۡمُرۡسَلِينَ", "Indeed you, [O Muhammad], are from among the messengers"], ["عَلَىٰ صِرَٰطٖ مُّسۡتَقِيمٖ", "On a straight path"], ["تَنزِيلَ ٱلۡعَزِيزِ ٱلرَّحِيمِ", "[This is] a revelation of the Exalted in Might, the Merciful"], ["لِتُنذِرَ قَوۡمٗا مَّآ أُنذِرَ ءَابَآؤُهُمۡ فَهُمۡ غَٰفِلُونَ", "That you may warn a people whose forefathers were not warned, so they are unaware"], ["لَقَدۡ حَقَّ ٱلۡقَوۡلُ عَلَىٰٓ أَكۡثَرِهِمۡ فَهُمۡ لَا يُؤۡمِنُونَ", "Already the word has come into effect upon most of them, so they do not believe"], ["إِنَّا جَعَلۡنَا فِيٓ أَعۡنَٰقِهِمۡ أَغۡلَٰلٗا فَهِيَ إِلَى ٱلۡأَذۡقَانِ فَهُم مُّقۡمَحُونَ", "Indeed, We have put shackles on their necks, and they are to their chins, so they are with heads [kept] aloft"], ["وَجَعَلۡنَا مِنۢ بَيۡنِ أَيۡدِيهِمۡ سَدّٗا وَمِنۡ خَلۡفِهِمۡ سَدّٗا فَأَغۡشَيۡنَٰهُمۡ فَهُمۡ لَا يُبۡصِرُونَ", "And We have put before them a barrier and behind them a barrier and covered them, so they do not see"], ["وَسَوَآءٌ عَلَيۡهِمۡ ءَأَنذَرۡتَهُمۡ أَمۡ لَمۡ تُنذِرۡهُمۡ لَا يُؤۡمِنُونَ", "And it is all the same for them whether you warn them or do not warn them - they will not believe"], ["إِنَّمَا تُنذِرُ مَنِ ٱتَّبَعَ ٱلذِّكۡرَ وَخَشِيَ ٱلرَّحۡمَٰنَ بِٱلۡغَيۡبِۖ فَبَشِّرۡهُ بِمَغۡفِرَةٖ وَأَجۡرٖ كَرِيمٍ", "You can only warn one who follows the message and fears the Most Merciful unseen. So give him good tidings of forgiveness and noble reward"], ["إِنَّا نَحۡنُ نُحۡيِ ٱلۡمَوۡتَىٰ وَنَكۡتُبُ مَا قَدَّمُواْ وَءَاثَٰرَهُمۡۚ وَكُلَّ شَيۡءٍ أَحۡصَيۡنَٰهُ فِيٓ إِمَامٖ مُّبِينٖ", "Indeed, it is We who bring the dead to life and record what they have put forth and what they left behind, and all things We have enumerated in a clear register"]]}], "10": [{"n": 49, "ar": "الحجرات", "en": "Al-Hujurat", "from": 1, "to": 12, "v": [["يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ لَا تُقَدِّمُواْ بَيۡنَ يَدَيِ ٱللَّهِ وَرَسُولِهِۦۖ وَٱتَّقُواْ ٱللَّهَۚ إِنَّ ٱللَّهَ سَمِيعٌ عَلِيمࣱ", "O you who have believed, do not put [yourselves] before Allah and His Messenger but fear Allah. Indeed, Allah is Hearing and Knowing"], ["يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ لَا تَرۡفَعُوٓاْ أَصۡوَٰتَكُمۡ فَوۡقَ صَوۡتِ ٱلنَّبِيِّ وَلَا تَجۡهَرُواْ لَهُۥ بِٱلۡقَوۡلِ كَجَهۡرِ بَعۡضِكُمۡ لِبَعۡضٍ أَن تَحۡبَطَ أَعۡمَٰلُكُمۡ وَأَنتُمۡ لَا تَشۡعُرُونَ", "O you who have believed, do not raise your voices above the voice of the Prophet or be loud to him in speech like the loudness of some of you to others, lest your deeds become worthless while you perceive not"], ["إِنَّ ٱلَّذِينَ يَغُضُّونَ أَصۡوَٰتَهُمۡ عِندَ رَسُولِ ٱللَّهِ أُوْلَـٰٓئِكَ ٱلَّذِينَ ٱمۡتَحَنَ ٱللَّهُ قُلُوبَهُمۡ لِلتَّقۡوَىٰۚ لَهُم مَّغۡفِرَةࣱ وَأَجۡرٌ عَظِيمٌ", "Indeed, those who lower their voices before the Messenger of Allah - they are the ones whose hearts Allah has tested for righteousness. For them is forgiveness and great reward"], ["إِنَّ ٱلَّذِينَ يُنَادُونَكَ مِن وَرَآءِ ٱلۡحُجُرَٰتِ أَكۡثَرُهُمۡ لَا يَعۡقِلُونَ", "Indeed, those who call you, [O Muhammad], from behind the chambers - most of them do not use reason"], ["وَلَوۡ أَنَّهُمۡ صَبَرُواْ حَتَّىٰ تَخۡرُجَ إِلَيۡهِمۡ لَكَانَ خَيۡرٗا لَّهُمۡۚ وَٱللَّهُ غَفُورࣱ رَّحِيمࣱ", "And if they had been patient until you [could] come out to them, it would have been better for them. But Allah is Forgiving and Merciful"], ["يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓاْ إِن جَآءَكُمۡ فَاسِقُۢ بِنَبَإٖ فَتَبَيَّنُوٓاْ أَن تُصِيبُواْ قَوۡمَۢا بِجَهَٰلَةٖ فَتُصۡبِحُواْ عَلَىٰ مَا فَعَلۡتُمۡ نَٰدِمِينَ", "O you who have believed, if there comes to you a disobedient one with information, investigate, lest you harm a people out of ignorance and become, over what you have done, regretful"], ["وَٱعۡلَمُوٓاْ أَنَّ فِيكُمۡ رَسُولَ ٱللَّهِۚ لَوۡ يُطِيعُكُمۡ فِي كَثِيرٖ مِّنَ ٱلۡأَمۡرِ لَعَنِتُّمۡ وَلَٰكِنَّ ٱللَّهَ حَبَّبَ إِلَيۡكُمُ ٱلۡإِيمَٰنَ وَزَيَّنَهُۥ فِي قُلُوبِكُمۡ وَكَرَّهَ إِلَيۡكُمُ ٱلۡكُفۡرَ وَٱلۡفُسُوقَ وَٱلۡعِصۡيَانَۚ أُوْلَـٰٓئِكَ هُمُ ٱلرَّـٰشِدُونَ", "And know that among you is the Messenger of Allah. If he were to obey you in much of the matter, you would be in difficulty, but Allah has endeared to you the faith and has made it pleasing in your hearts and has made hateful to you disbelief, defiance and disobedience. Those are the [rightly] guided"], ["فَضۡلٗا مِّنَ ٱللَّهِ وَنِعۡمَةٗۚ وَٱللَّهُ عَلِيمٌ حَكِيمࣱ", "[It is] as bounty from Allah and favor. And Allah is Knowing and Wise"], ["وَإِن طَآئِفَتَانِ مِنَ ٱلۡمُؤۡمِنِينَ ٱقۡتَتَلُواْ فَأَصۡلِحُواْ بَيۡنَهُمَاۖ فَإِنۢ بَغَتۡ إِحۡدَىٰهُمَا عَلَى ٱلۡأُخۡرَىٰ فَقَٰتِلُواْ ٱلَّتِي تَبۡغِي حَتَّىٰ تَفِيٓءَ إِلَىٰٓ أَمۡرِ ٱللَّهِۚ فَإِن فَآءَتۡ فَأَصۡلِحُواْ بَيۡنَهُمَا بِٱلۡعَدۡلِ وَأَقۡسِطُوٓاْۖ إِنَّ ٱللَّهَ يُحِبُّ ٱلۡمُقۡسِطِينَ", "And if two factions among the believers should fight, then make settlement between the two. But if one of them oppresses the other, then fight against the one that oppresses until it returns to the ordinance of Allah. And if it returns, then make settlement between them in justice and act justly. Indeed, Allah loves those who act justly"], ["إِنَّمَا ٱلۡمُؤۡمِنُونَ إِخۡوَةࣱ فَأَصۡلِحُواْ بَيۡنَ أَخَوَيۡكُمۡۚ وَٱتَّقُواْ ٱللَّهَ لَعَلَّكُمۡ تُرۡحَمُونَ", "The believers are but brothers, so make settlement between your brothers. And fear Allah that you may receive mercy"], ["يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ لَا يَسۡخَرۡ قَوۡمࣱ مِّن قَوۡمٍ عَسَىٰٓ أَن يَكُونُواْ خَيۡرٗا مِّنۡهُمۡ وَلَا نِسَآءࣱ مِّن نِّسَآءٍ عَسَىٰٓ أَن يَكُنَّ خَيۡرٗا مِّنۡهُنَّۖ وَلَا تَلۡمِزُوٓاْ أَنفُسَكُمۡ وَلَا تَنَابَزُواْ بِٱلۡأَلۡقَٰبِۖ بِئۡسَ ٱلِٱسۡمُ ٱلۡفُسُوقُ بَعۡدَ ٱلۡإِيمَٰنِۚ وَمَن لَّمۡ يَتُبۡ فَأُوْلَـٰٓئِكَ هُمُ ٱلظَّـٰلِمُونَ", "O you who have believed, let not a people ridicule [another] people; perhaps they may be better than them; nor let women ridicule [other] women; perhaps they may be better than them. And do not insult one another and do not call each other by [offensive] nicknames. Wretched is the name of disobedience after [one's] faith. And whoever does not repent - then it is those who are the wrongdoers"], ["يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱجۡتَنِبُواْ كَثِيرٗا مِّنَ ٱلظَّنِّ إِنَّ بَعۡضَ ٱلظَّنِّ إِثۡمࣱۖ وَلَا تَجَسَّسُواْ وَلَا يَغۡتَب بَّعۡضُكُم بَعۡضًاۚ أَيُحِبُّ أَحَدُكُمۡ أَن يَأۡكُلَ لَحۡمَ أَخِيهِ مَيۡتٗا فَكَرِهۡتُمُوهُۚ وَٱتَّقُواْ ٱللَّهَۚ إِنَّ ٱللَّهَ تَوَّابࣱ رَّحِيمࣱ", "O you who have believed, avoid much [negative] assumption. Indeed, some assumption is sin. And do not spy or backbite each other. Would one of you like to eat the flesh of his brother when dead? You would detest it. And fear Allah; indeed, Allah is Accepting of repentance and Merciful"]]}], "11": [{"n": 18, "ar": "الكهف", "en": "Al-Kahf", "from": 1, "to": 12, "v": [["ٱلۡحَمۡدُ لِلَّهِ ٱلَّذِيٓ أَنزَلَ عَلَىٰ عَبۡدِهِ ٱلۡكِتَٰبَ وَلَمۡ يَجۡعَل لَّهُۥ عِوَجَاۜ", "[All] praise is [due] to Allah, who has sent down upon His Servant the Book and has not made therein any deviance"], ["قَيِّمٗا لِّيُنذِرَ بَأۡسٗا شَدِيدٗا مِّن لَّدُنۡهُ وَيُبَشِّرَ ٱلۡمُؤۡمِنِينَ ٱلَّذِينَ يَعۡمَلُونَ ٱلصَّـٰلِحَٰتِ أَنَّ لَهُمۡ أَجۡرًا حَسَنٗا", "[He has made it] straight, to warn of severe punishment from Him and to give good tidings to the believers who do righteous deeds that they will have a good reward"], ["مَّـٰكِثِينَ فِيهِ أَبَدٗا", "In which they will remain forever"], ["وَيُنذِرَ ٱلَّذِينَ قَالُواْ ٱتَّخَذَ ٱللَّهُ وَلَدٗا", "And to warn those who say, \"Allah has taken a son"], ["مَّا لَهُم بِهِۦ مِنۡ عِلۡمٖ وَلَا لِأٓبَآئِهِمۡۚ كَبُرَتۡ كَلِمَةٗ تَخۡرُجُ مِنۡ أَفۡوَٰهِهِمۡۚ إِن يَقُولُونَ إِلَّا كَذِبٗا", "They have no knowledge of it, nor had their fathers. Grave is the word that comes out of their mouths; they speak not except a lie"], ["فَلَعَلَّكَ بَٰخِعࣱ نَّفۡسَكَ عَلَىٰٓ ءَاثَٰرِهِمۡ إِن لَّمۡ يُؤۡمِنُواْ بِهَٰذَا ٱلۡحَدِيثِ أَسَفًا", "Then perhaps you would kill yourself through grief over them, [O Muhammad], if they do not believe in this message, [and] out of sorrow"], ["إِنَّا جَعَلۡنَا مَا عَلَى ٱلۡأَرۡضِ زِينَةٗ لَّهَا لِنَبۡلُوَهُمۡ أَيُّهُمۡ أَحۡسَنُ عَمَلٗا", "Indeed, We have made that which is on the earth adornment for it that We may test them [as to] which of them is best in deed"], ["وَإِنَّا لَجَٰعِلُونَ مَا عَلَيۡهَا صَعِيدٗا جُرُزًا", "And indeed, We will make that which is upon it [into] a barren ground"], ["أَمۡ حَسِبۡتَ أَنَّ أَصۡحَٰبَ ٱلۡكَهۡفِ وَٱلرَّقِيمِ كَانُواْ مِنۡ ءَايَٰتِنَا عَجَبًا", "Or have you thought that the companions of the cave and the inscription were, among Our signs, a wonder"], ["إِذۡ أَوَى ٱلۡفِتۡيَةُ إِلَى ٱلۡكَهۡفِ فَقَالُواْ رَبَّنَآ ءَاتِنَا مِن لَّدُنكَ رَحۡمَةٗ وَهَيِّئۡ لَنَا مِنۡ أَمۡرِنَا رَشَدٗا", "[Mention] when the youths retreated to the cave and said, \"Our Lord, grant us from Yourself mercy and prepare for us from our affair right guidance"], ["فَضَرَبۡنَا عَلَىٰٓ ءَاذَانِهِمۡ فِي ٱلۡكَهۡفِ سِنِينَ عَدَدٗا", "So We cast [a cover of sleep] over their ears within the cave for a number of years"], ["ثُمَّ بَعَثۡنَٰهُمۡ لِنَعۡلَمَ أَيُّ ٱلۡحِزۡبَيۡنِ أَحۡصَىٰ لِمَا لَبِثُوٓاْ أَمَدٗا", "Then We awakened them that We might show which of the two factions was most precise in calculating what [extent] they had remained in time"]]}], "12": [{"n": 33, "ar": "الأحزاب", "en": "Al-Ahzab", "from": 1, "to": 12, "v": [["يَـٰٓأَيُّهَا ٱلنَّبِيُّ ٱتَّقِ ٱللَّهَ وَلَا تُطِعِ ٱلۡكَٰفِرِينَ وَٱلۡمُنَٰفِقِينَۚ إِنَّ ٱللَّهَ كَانَ عَلِيمًا حَكِيمٗا", "O Prophet, fear Allah and do not obey the disbelievers and the hypocrites. Indeed, Allah is ever Knowing and Wise"], ["وَٱتَّبِعۡ مَا يُوحَىٰٓ إِلَيۡكَ مِن رَّبِّكَۚ إِنَّ ٱللَّهَ كَانَ بِمَا تَعۡمَلُونَ خَبِيرٗا", "And follow that which is revealed to you from your Lord. Indeed Allah is ever, with what you do, Acquainted"], ["وَتَوَكَّلۡ عَلَى ٱللَّهِۚ وَكَفَىٰ بِٱللَّهِ وَكِيلٗا", "And rely upon Allah; and sufficient is Allah as Disposer of affairs"], ["مَّا جَعَلَ ٱللَّهُ لِرَجُلٖ مِّن قَلۡبَيۡنِ فِي جَوۡفِهِۦۚ وَمَا جَعَلَ أَزۡوَٰجَكُمُ ٱلَّـٰٓـِٔي تُظَٰهِرُونَ مِنۡهُنَّ أُمَّهَٰتِكُمۡۚ وَمَا جَعَلَ أَدۡعِيَآءَكُمۡ أَبۡنَآءَكُمۡۚ ذَٰلِكُمۡ قَوۡلُكُم بِأَفۡوَٰهِكُمۡۖ وَٱللَّهُ يَقُولُ ٱلۡحَقَّ وَهُوَ يَهۡدِي ٱلسَّبِيلَ", "Allah has not made for a man two hearts in his interior. And He has not made your wives whom you declare unlawful your mothers. And he has not made your adopted sons your [true] sons. That is [merely] your saying by your mouths, but Allah says the truth, and He guides to the [right] way"], ["ٱدۡعُوهُمۡ لِأٓبَآئِهِمۡ هُوَ أَقۡسَطُ عِندَ ٱللَّهِۚ فَإِن لَّمۡ تَعۡلَمُوٓاْ ءَابَآءَهُمۡ فَإِخۡوَٰنُكُمۡ فِي ٱلدِّينِ وَمَوَٰلِيكُمۡۚ وَلَيۡسَ عَلَيۡكُمۡ جُنَاحࣱ فِيمَآ أَخۡطَأۡتُم بِهِۦ وَلَٰكِن مَّا تَعَمَّدَتۡ قُلُوبُكُمۡۚ وَكَانَ ٱللَّهُ غَفُورٗا رَّحِيمًا", "Call them by [the names of] their fathers; it is more just in the sight of Allah. But if you do not know their fathers - then they are [still] your brothers in religion and those entrusted to you. And there is no blame upon you for that in which you have erred but [only for] what your hearts intended. And ever is Allah Forgiving and Merciful"], ["ٱلنَّبِيُّ أَوۡلَىٰ بِٱلۡمُؤۡمِنِينَ مِنۡ أَنفُسِهِمۡۖ وَأَزۡوَٰجُهُۥٓ أُمَّهَٰتُهُمۡۗ وَأُوْلُواْ ٱلۡأَرۡحَامِ بَعۡضُهُمۡ أَوۡلَىٰ بِبَعۡضٖ فِي كِتَٰبِ ٱللَّهِ مِنَ ٱلۡمُؤۡمِنِينَ وَٱلۡمُهَٰجِرِينَ إِلَّآ أَن تَفۡعَلُوٓاْ إِلَىٰٓ أَوۡلِيَآئِكُم مَّعۡرُوفٗاۚ كَانَ ذَٰلِكَ فِي ٱلۡكِتَٰبِ مَسۡطُورٗا", "The Prophet is more worthy of the believers than themselves, and his wives are [in the position of] their mothers. And those of [blood] relationship are more entitled [to inheritance] in the decree of Allah than the [other] believers and the emigrants, except that you may do to your close associates a kindness [through bequest]. That was in the Book inscribed"], ["وَإِذۡ أَخَذۡنَا مِنَ ٱلنَّبِيِّـۧنَ مِيثَٰقَهُمۡ وَمِنكَ وَمِن نُّوحٖ وَإِبۡرَٰهِيمَ وَمُوسَىٰ وَعِيسَى ٱبۡنِ مَرۡيَمَۖ وَأَخَذۡنَا مِنۡهُم مِّيثَٰقًا غَلِيظٗا", "And [mention, O Muhammad], when We took from the prophets their covenant and from you and from Noah and Abraham and Moses and Jesus, the son of Mary; and We took from them a solemn covenant"], ["لِّيَسۡـَٔلَ ٱلصَّـٰدِقِينَ عَن صِدۡقِهِمۡۚ وَأَعَدَّ لِلۡكَٰفِرِينَ عَذَابًا أَلِيمٗا", "That He may question the truthful about their truth. And He has prepared for the disbelievers a painful punishment"], ["يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱذۡكُرُواْ نِعۡمَةَ ٱللَّهِ عَلَيۡكُمۡ إِذۡ جَآءَتۡكُمۡ جُنُودࣱ فَأَرۡسَلۡنَا عَلَيۡهِمۡ رِيحٗا وَجُنُودٗا لَّمۡ تَرَوۡهَاۚ وَكَانَ ٱللَّهُ بِمَا تَعۡمَلُونَ بَصِيرًا", "O you who have believed, remember the favor of Allah upon you when armies came to [attack] you and We sent upon them a wind and armies [of angels] you did not see. And ever is Allah, of what you do, Seeing"], ["إِذۡ جَآءُوكُم مِّن فَوۡقِكُمۡ وَمِنۡ أَسۡفَلَ مِنكُمۡ وَإِذۡ زَاغَتِ ٱلۡأَبۡصَٰرُ وَبَلَغَتِ ٱلۡقُلُوبُ ٱلۡحَنَاجِرَ وَتَظُنُّونَ بِٱللَّهِ ٱلظُّنُونَا۠", "[Remember] when they came at you from above you and from below you, and when eyes shifted [in fear], and hearts reached the throats and you assumed about Allah [various] assumptions"], ["هُنَالِكَ ٱبۡتُلِيَ ٱلۡمُؤۡمِنُونَ وَزُلۡزِلُواْ زِلۡزَالٗا شَدِيدٗا", "There the believers were tested and shaken with a severe shaking"], ["وَإِذۡ يَقُولُ ٱلۡمُنَٰفِقُونَ وَٱلَّذِينَ فِي قُلُوبِهِم مَّرَضࣱ مَّا وَعَدَنَا ٱللَّهُ وَرَسُولُهُۥٓ إِلَّا غُرُورٗا", "And [remember] when the hypocrites and those in whose hearts is disease said, \"Allah and His Messenger did not promise us except delusion"]]}], "13": [{"n": 24, "ar": "النور", "en": "An-Nur", "from": 1, "to": 12, "v": [["سُورَةٌ أَنزَلۡنَٰهَا وَفَرَضۡنَٰهَا وَأَنزَلۡنَا فِيهَآ ءَايَٰتِۭ بَيِّنَٰتٖ لَّعَلَّكُمۡ تَذَكَّرُونَ", "[This is] a surah which We have sent down and made [that within it] obligatory and revealed therein verses of clear evidence that you might remember"], ["ٱلزَّانِيَةُ وَٱلزَّانِي فَٱجۡلِدُواْ كُلَّ وَٰحِدٖ مِّنۡهُمَا مِاْئَةَ جَلۡدَةٖۖ وَلَا تَأۡخُذۡكُم بِهِمَا رَأۡفَةࣱ فِي دِينِ ٱللَّهِ إِن كُنتُمۡ تُؤۡمِنُونَ بِٱللَّهِ وَٱلۡيَوۡمِ ٱلۡأٓخِرِۖ وَلۡيَشۡهَدۡ عَذَابَهُمَا طَآئِفَةࣱ مِّنَ ٱلۡمُؤۡمِنِينَ", "The [unmarried] woman or [unmarried] man found guilty of sexual intercourse - lash each one of them with a hundred lashes, and do not be taken by pity for them in the religion of Allah, if you should believe in Allah and the Last Day. And let a group of the believers witness their punishment"], ["ٱلزَّانِي لَا يَنكِحُ إِلَّا زَانِيَةً أَوۡ مُشۡرِكَةٗ وَٱلزَّانِيَةُ لَا يَنكِحُهَآ إِلَّا زَانٍ أَوۡ مُشۡرِكࣱۚ وَحُرِّمَ ذَٰلِكَ عَلَى ٱلۡمُؤۡمِنِينَ", "The fornicator does not marry except a [female] fornicator or polytheist, and none marries her except a fornicator or a polytheist, and that has been made unlawful to the believers"], ["وَٱلَّذِينَ يَرۡمُونَ ٱلۡمُحۡصَنَٰتِ ثُمَّ لَمۡ يَأۡتُواْ بِأَرۡبَعَةِ شُهَدَآءَ فَٱجۡلِدُوهُمۡ ثَمَٰنِينَ جَلۡدَةٗ وَلَا تَقۡبَلُواْ لَهُمۡ شَهَٰدَةً أَبَدٗاۚ وَأُوْلَـٰٓئِكَ هُمُ ٱلۡفَٰسِقُونَ", "And those who accuse chaste women and then do not produce four witnesses - lash them with eighty lashes and do not accept from them testimony ever after. And those are the defiantly disobedient"], ["إِلَّا ٱلَّذِينَ تَابُواْ مِنۢ بَعۡدِ ذَٰلِكَ وَأَصۡلَحُواْ فَإِنَّ ٱللَّهَ غَفُورࣱ رَّحِيمࣱ", "Except for those who repent thereafter and reform, for indeed, Allah is Forgiving and Merciful"], ["وَٱلَّذِينَ يَرۡمُونَ أَزۡوَٰجَهُمۡ وَلَمۡ يَكُن لَّهُمۡ شُهَدَآءُ إِلَّآ أَنفُسُهُمۡ فَشَهَٰدَةُ أَحَدِهِمۡ أَرۡبَعُ شَهَٰدَٰتِۭ بِٱللَّهِ إِنَّهُۥ لَمِنَ ٱلصَّـٰدِقِينَ", "And those who accuse their wives [of adultery] and have no witnesses except themselves - then the witness of one of them [shall be] four testimonies [swearing] by Allah that indeed, he is of the truthful"], ["وَٱلۡخَٰمِسَةُ أَنَّ لَعۡنَتَ ٱللَّهِ عَلَيۡهِ إِن كَانَ مِنَ ٱلۡكَٰذِبِينَ", "And the fifth [oath will be] that the curse of Allah be upon him if he should be among the liars"], ["وَيَدۡرَؤُاْ عَنۡهَا ٱلۡعَذَابَ أَن تَشۡهَدَ أَرۡبَعَ شَهَٰدَٰتِۭ بِٱللَّهِ إِنَّهُۥ لَمِنَ ٱلۡكَٰذِبِينَ", "But it will prevent punishment from her if she gives four testimonies [swearing] by Allah that indeed, he is of the liars"], ["وَٱلۡخَٰمِسَةَ أَنَّ غَضَبَ ٱللَّهِ عَلَيۡهَآ إِن كَانَ مِنَ ٱلصَّـٰدِقِينَ", "And the fifth [oath will be] that the wrath of Allah be upon her if he was of the truthful"], ["وَلَوۡلَا فَضۡلُ ٱللَّهِ عَلَيۡكُمۡ وَرَحۡمَتُهُۥ وَأَنَّ ٱللَّهَ تَوَّابٌ حَكِيمٌ", "And if not for the favor of Allah upon you and His mercy... and because Allah is Accepting of repentance and Wise"], ["إِنَّ ٱلَّذِينَ جَآءُو بِٱلۡإِفۡكِ عُصۡبَةࣱ مِّنكُمۡۚ لَا تَحۡسَبُوهُ شَرّٗا لَّكُمۖ بَلۡ هُوَ خَيۡرࣱ لَّكُمۡۚ لِكُلِّ ٱمۡرِيٕٖ مِّنۡهُم مَّا ٱكۡتَسَبَ مِنَ ٱلۡإِثۡمِۚ وَٱلَّذِي تَوَلَّىٰ كِبۡرَهُۥ مِنۡهُمۡ لَهُۥ عَذَابٌ عَظِيمࣱ", "Indeed, those who came with falsehood are a group among you. Do not think it bad for you; rather it is good for you. For every person among them is what [punishment] he has earned from the sin, and he who took upon himself the greater portion thereof - for him is a great punishment"], ["لَّوۡلَآ إِذۡ سَمِعۡتُمُوهُ ظَنَّ ٱلۡمُؤۡمِنُونَ وَٱلۡمُؤۡمِنَٰتُ بِأَنفُسِهِمۡ خَيۡرٗا وَقَالُواْ هَٰذَآ إِفۡكࣱ مُّبِينࣱ", "Why, when you heard it, did not the believing men and believing women think good of one another and say, \"This is an obvious falsehood"]]}]};

const KEY='rsdIslamicEd.v1';
let S = load();
function load(){ try{ const x=JSON.parse(localStorage.getItem(KEY)); if(x) return x; }catch(e){} return {name:'',year:null,xp:0,streak:0,last:null,days:{},stars:{},verses:{},played:{},badges:{},perfect:0,support:false,sound:true}; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
function touchStreak(){
  const t=today(); if(S.last===t) return;
  const y=new Date(); y.setDate(y.getDate()-1);
  const ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  S.streak = (S.last===ys) ? S.streak+1 : 1; S.last=t;
}
function liveStreak(){ if(!S.last) return 0; const y=new Date(); y.setDate(y.getDate()-1); const ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate(); return (S.last===today()||S.last===ys)?S.streak:0; }

  const t=actx.currentTime; o.type='sine'; if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(880,t+.09);}else{o.frequency.setValueAtTime(220,t);}
  g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.28); o.start(t); o.stop(t+.3);}catch(e){} }

function checkBadges(){
  const y=S.year, topics=CONTENT[y]||[];
  const done=topics.filter((t,i)=>S.stars[y+'-'+i]).length;
  if(Object.keys(S.stars).length||Object.keys(S.played).length) award('first');
  if(liveStreak()>=3) award('streak3'); if(liveStreak()>=7) award('streak7');

  if(done>=3) award('explorer'); if(topics.length && done===topics.length) award('master');

function renderPath(body){
  const y=S.year, topics=CONTENT[y]||[];
  const W=Math.min(app.clientWidth,520), cx=W/2, amp=Math.min(95,W*0.2), gap=148, top0=96;
  const nodes=[{kind:'surah'}].concat(topics.map((t,i)=>({kind:'topic',i,t})));
  const H=top0+gap*(nodes.length-1)+190+(topics.length?0:200);
  const wrap=$(`<div class="pathwrap" style="height:${H}px"></div>`);
  const pts=nodes.map((n,k)=>({x:cx+amp*Math.sin(k*1.15),y:top0+gap*k}));
  let d=`M${pts[0].x} ${pts[0].y}`; for(let k=1;k<pts.length;k++){const a=pts[k-1],b=pts[k];const my=(a.y+b.y)/2;d+=` C${a.x} ${my} ${b.x} ${my} ${b.x} ${b.y}`;}
  wrap.appendChild($(`<svg class="pathsvg" width="${W}" height="${H}"><path d="${d}" fill="none" stroke="#F5DDA9" stroke-width="34" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="10 12" stroke-linecap="round"/></svg>`));
  const nextIdx=topics.findIndex((t,i)=>!S.stars[y+'-'+i]);
  nodes.forEach((n,k)=>{
    const p=pts[k], left=p.x<cx-5, side=(p.x>=cx)?'left':'right';
    let node;
    if(n.kind==='surah'){
      const tot=(SURAHS[y]||[]).reduce((a,s)=>a+s.v.length,0), tk=Object.values(S.verses[y]||{}).filter(Boolean).length;
      node=$(`<button class="node surah" style="left:${p.x}px;top:${p.y}px" aria-label="Surah target">${I.book()}</button>`);
      node.onclick=()=>home('surah');
      const names=(SURAHS[y]||[]).map(s=>s.en).join(' & ');
      wrap.appendChild(tagEl(p,side,W,`<i>Surah target</i><b>${esc(names)}</b>${tk}/${tot} verses memorised`));
    } else {
      const st=S.stars[y+'-'+n.i]||0;
      node=$(`<button class="node ${st?'done':''} ${n.i===nextIdx?'next':''}" style="left:${p.x}px;top:${p.y}px" aria-label="${esc(n.t.t)}">${n.i+1}<span class="stars">${[1,2,3].map(s=>I.star(16,s<=st?'#F2B61C':'#E2E8F0')).join('')}</span></button>`);
      node.onclick=()=>startTopic(n.i);
      wrap.appendChild(tagEl(p,side,W,`<i>${esc(n.t.u)}</i><b>${esc(n.t.t)}</b>`));
      if(n.i===nextIdx){ const sb=$(`<div class="startbub" style="left:${p.x}px;top:${p.y-46}px">${st?'NEXT':'START'}</div>`); wrap.appendChild(sb); }
    }

}
function tagEl(p,side,W,html){
  const w=150, x = side==='left' ? Math.max(8,p.x-48-w) : Math.min(W-w-8,p.x+48);

/* ---------- topic session ---------- */
function startTopic(i){
  const y=S.year, t=CONTENT[y][i]; const steps=[{type:'learn'}];
  shuffle(t.q).forEach(q=>steps.push({type:'quiz',q:q[0],opts:q[1]}));
  if(t.m) steps.push({type:'match',pairs:t.m});
  if(t.s) steps.push({type:'sort',bins:t.s[0],items:t.s[1]});
  if(t.o) steps.push({type:'order',items:t.o});
  runSession({title:t.t, learn:t.L, steps, onDone:(c,n)=>finishTopic(i,c,n)});
}
function finishTopic(i,c,n){
  const y=S.year, pct=n?c/n:1, st=pct>=.9?3:pct>=.7?2:1, key=y+'-'+i;
  S.stars[key]=Math.max(S.stars[key]||0,st); if(pct===1) S.perfect++;
  touchStreak(); save(); checkBadges(); result(st,c,n,()=>home('path'),()=>startTopic(i));
}

function runSession(cfg){
  let k=0, correct=0, total=0, xp0=S.xp;
  const counted=cfg.steps.filter(s=>s.type!=='learn').length;
  const el=$(`<div class="screen ${S.support?'support':''}"><div class="gamehead"><button id="q" aria-label="Quit">${I.x}</button><div class="bar"><i style="width:0"></i></div></div><div id="stage" style="flex:1;display:flex;flex-direction:column"></div></div>`);
  el.querySelector('#q').onclick=()=>home(cfg.back||'path');
  const stage=el.querySelector('#stage'), bar=el.querySelector('.bar i');
  show(el);
  const next=()=>{ bar.style.width=(100*k/cfg.steps.length)+'%'; if(k>=cfg.steps.length){ cfg.onDone(correct,total); return;} const s=cfg.steps[k++]; stage.innerHTML=''; render(s); };
  const add=(c,n)=>{ correct+=c; total+=n; S.xp+=c*10; save(); };
  function render(s){
    if(s.type==='learn') return learnStep(stage,cfg,next);
    if(s.type==='quiz') return quizStep(stage,s,add,next);
    if(s.type==='match') return matchStep(stage,s,add,next);
    if(s.type==='sort') return sortStep(stage,s,add,next);
    if(s.type==='order') return orderStep(stage,s,add,next);
  }
  next();
}
function feedback(stage,ok,msg,next){
  tone(ok);
  const f=$(`<div class="feedback ${ok?'ok':'no'}"><h3>${ok?pick(['Well done!','Excellent!','MashāʾAllāh!','Great job!']):'Not quite'}</h3>${msg?`<p>${msg}</p>`:''}<button class="btn ${ok?'green':'navy'}">Continue</button></div>`);
  f.querySelector('button').onclick=next; stage.appendChild(f); f.querySelector('button').focus();
}
const pick=a=>a[Math.floor(Math.random()*a.length)];

function learnStep(stage,cfg,next){

function quizStep(stage,s,add,next){
  let opts=s.opts.map((o,i)=>({o,ok:i===0}));
  if(S.support && opts.length>3) opts=[opts[0]].concat(shuffle(opts.slice(1)).slice(0,2));
  opts=shuffle(opts);
  const el=$(`<div class="pad"><span class="kind">${s.kind||'Quiz'}</span><div class="qtext ${s.arQ?'ar':''}" style="${s.arQ?'font-family:Amiri Quran,serif;font-size:26px;text-align:right;line-height:2':''}">${s.qhtml||esc(s.q)}</div>
    ${s.arQ?'':`<button class="speak" id="sp" style="margin:-6px 0 14px">${I.sound} Listen</button>`}<div class="opts"></div></div>`);
  const box=el.querySelector('.opts'); let done=false;
  const sp=el.querySelector('#sp'); if(sp) sp.onclick=()=>say(s.q+'. '+opts.map(o=>o.o).join('. '));
  opts.forEach(o=>{ const b=$(`<button class="opt ${s.arOpts?'ar':''}">${esc(o.o)}</button>`);
    b.onclick=()=>{ if(done) return; done=true; b.classList.add(o.ok?'right':'wrong'); if(!o.ok){ b.classList.add('shake'); [...box.children][opts.findIndex(x=>x.ok)].classList.add('right'); }
      add(o.ok?1:0,1); feedback(stage,o.ok,o.ok?'':(s.arOpts?'The correct answer is highlighted in green.':'Answer: '+esc(opts.find(x=>x.ok).o)),next); };
    box.appendChild(b); });
  stage.appendChild(el);
}

function matchStep(stage,s,add,next){
  const pairs=s.pairs.slice(0,5); let sel=null, left=pairs.length, mistakes=0;
  const el=$(`<div class="pad"><span class="kind">${s.kind||'Match the pairs'}</span><div class="qtext">${s.prompt||'Tap a word, then its meaning.'}</div><div class="matchgrid"><div class="opts" id="L"></div><div class="opts" id="R"></div></div></div>`);
  const L=el.querySelector('#L'), R=el.querySelector('#R');
  shuffle(pairs.map((p,i)=>({p,i}))).forEach(({p,i})=>{ const b=$(`<button class="opt ${s.arLeft?'ar':''}">${esc(p[0])}</button>`); b.dataset.i=i; b.onclick=()=>{ L.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel=b; }; L.appendChild(b); });
  shuffle(pairs.map((p,i)=>({p,i}))).forEach(({p,i})=>{ const b=$(`<button class="opt">${esc(p[1])}</button>`);
    b.onclick=()=>{ if(!sel){ b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),400); return; }
      if(+sel.dataset.i===i){ tone(true); const a=sel; a.classList.add('right'); b.classList.add('right'); setTimeout(()=>{a.classList.add('gone');b.classList.add('gone');},350); sel=null; left--;
        if(left===0){ const c=Math.max(0,pairs.length-mistakes); add(c,pairs.length); setTimeout(()=>feedback(stage,mistakes===0,mistakes?`All matched with ${mistakes} slip${mistakes>1?'s':''}.`:'All matched first time!',next),450); } }
      else { tone(false); mistakes++; b.classList.add('wrong','shake'); sel.classList.add('wrong'); const a=sel; setTimeout(()=>{b.classList.remove('wrong','shake');a.classList.remove('wrong');},450); } };
    R.appendChild(b); });
  stage.appendChild(el);
}

function sortStep(stage,s,add,next){
  const items=shuffle(s.items); let k=0, right=0;
  const cols=['#5B8DEF','#E0475B','#B57EDC'];
  const el=$(`<div class="pad"><span class="kind">Sort it</span><div class="qtext">Where does it belong?</div><div class="sortitem"></div><div class="bins" style="grid-template-columns:repeat(${s.bins.length},1fr)"></div><p class="note" style="text-align:center;margin-top:14px" id="cnt"></p></div>`);
  const it=el.querySelector('.sortitem'), bins=el.querySelector('.bins'), cnt=el.querySelector('#cnt');
  const showItem=()=>{ it.textContent=items[k][0]; cnt.textContent=(k+1)+' of '+items.length; it.classList.remove('shake'); };
  s.bins.forEach((b,bi)=>{ const btn=$(`<button class="bin" style="background:${cols[bi]}">${esc(b)}</button>`);
    btn.onclick=()=>{ if(k>=items.length) return; const ok=items[k][1]===bi; tone(ok);
      if(ok){ right++; it.style.background='#E7F7EE'; } else { it.style.background='#FDECEE'; it.classList.add('shake'); it.textContent=items[k][0]+' → '+s.bins[items[k][1]]; }
      k++; setTimeout(()=>{ it.style.background=''; if(k<items.length) showItem(); else { add(right,items.length); feedback(stage,right===items.length,`You sorted ${right} of ${items.length} correctly.`,next);} }, ok?450:1300); };
    bins.appendChild(btn); });
  showItem(); stage.appendChild(el);
}

function orderStep(stage,s,add,next){
  const items=s.items.map((x,i)=>({x,i})); let want=0, mistakes=0;
  const el=$(`<div class="pad"><span class="kind">${s.kind||'Put in order'}</span><div class="qtext">${s.prompt||'Tap them in the right order.'}</div><div class="orderdone"></div><div class="opts"></div></div>`);
  const done=el.querySelector('.orderdone'), box=el.querySelector('.opts');
  shuffle(items).forEach(o=>{ const b=$(`<button class="opt ${s.ar?'ar':''}">${s.ar?o.x:esc(o.x)}</button>`);
    b.onclick=()=>{ if(o.i===want){ tone(true); want++; b.remove(); done.appendChild($(`<div class="${s.ar?'ar':''}"><span class="num">${want}</span><span>${s.ar?o.x:esc(o.x)}</span></div>`));
        if(want===items.length){ const c=Math.max(0,items.length-mistakes); add(c,items.length); feedback(stage,mistakes===0,mistakes?`Done, with ${mistakes} slip${mistakes>1?'s':''}.`:'Perfect order!',next);} }
      else { tone(false); mistakes++; b.classList.add('wrong','shake'); setTimeout(()=>b.classList.remove('wrong','shake'),450);} };
    box.appendChild(b); });
  stage.appendChild(el);
}

/* ---------- surah ---------- */
let surahIdx=0;
function renderSurah(body){
  const y=S.year, list=SURAHS[y]||[]; if(surahIdx>=list.length) surahIdx=0;
  const sr=list[surahIdx]; S.verses[y]=S.verses[y]||{};
  const tot=list.reduce((a,s)=>a+s.v.length,0), tk=Object.values(S.verses[y]).filter(Boolean).length;
  const el=$(`<div class="pad">
   ${list.length>1?`<div class="seg">${list.map((s,i)=>`<button data-i="${i}" class="${i===surahIdx?'on':''}">${esc(s.en)}</button>`).join('')}</div>`:''}

   <div class="gamegrid">

    <button class="gtile" style="background:var(--pink)" data-g="missing"><b>Missing Word</b><span>Find the word that's missing</span></button>

   </div>
   <h3 style="font-size:22px;color:var(--navy);margin:6px 0 10px">Read, recite & tick</h3>
   <p class="note" style="margin:-4px 0 12px">Tick a verse when you can recite it from memory to a partner or your teacher.</p>
   <div id="vs"></div></div>`);
  el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{surahIdx=+b.dataset.i;home('surah');});
  el.querySelectorAll('.gtile').forEach(b=>b.onclick=()=>surahGame(b.dataset.g));
  const vs=el.querySelector('#vs');

    const d=$(`<div class="verse"><div class="ar">${v[0]} <span class="vnum">${n}</span></div><p>${esc(v[1])}</p><button class="tick ${on?'on':''}"><span class="bx">${on?I.check:''}</span>I can recite verse ${n}</button></div>`);
    d.querySelector('.tick').onclick=()=>{ S.verses[y][key]=!S.verses[y][key]; if(S.verses[y][key]){ S.xp+=5; touchStreak(); } save(); checkBadges(); home('surah'); };

const words=t=>t.split(/\s+/).filter(Boolean);
const snip=(t,n=6)=>{const w=words(t);return w.length>n?w.slice(0,n).join(' ')+' …':t;};
function snips(texts,n){ const k=texts.map(()=>n); for(let r=0;r<30;r++){ const out=texts.map((t,i)=>snip(t,k[i])); let dup=false;
    out.forEach((o,i)=>{ if(out.filter(x=>x===o).length>1 && words(texts[i]).length>k[i]){ k[i]++; dup=true; } }); if(!dup) return out; } return texts.map((t,i)=>snip(t,k[i])); }
const plain=w=>w.replace(/[ً-ٰٟۖ-ۭـ]/g,'');
function surahGame(g){
  const y=S.year, sr=SURAHS[y][surahIdx], V=sr.v.map((v,i)=>({ar:v[0],en:v[1],n:sr.from+i}));
  const steps=[]; const N=V.length;
  if(g==='order'){
    for(let r=0;r<2;r++){ const len=Math.min(N,S.support?3:4); const st=Math.floor(Math.random()*(N-len+1));
      steps.push({type:'order',ar:true,kind:'Verse order',prompt:`Put verses ${V[st].n}–${V[st+len-1].n} in order.`,items:snips(V.slice(st,st+len).map(v=>v.ar),6)}); }
  }
  if(g==='next'){
    const ks=shuffle([...Array(N-1).keys()]).slice(0,Math.min(5,N-1));
    ks.forEach(k=>{ const others=shuffle(V.filter((v,j)=>j!==k+1&&j!==k)).slice(0,S.support?2:3); const o=snips([V[k+1].ar].concat(others.map(v=>v.ar)),6);
      steps.push({type:'quiz',kind:'What comes next?',arQ:true,arOpts:true,q:'',qhtml:`<span style="font-family:Nunito;font-size:15px;color:var(--muted);display:block;text-align:left;direction:ltr">Verse ${V[k].n}:</span>${snip(V[k].ar,9)}`,opts:o}); });
  }
  if(g==='missing'){
    const pool=[...new Set(V.flatMap(v=>words(v.ar)).filter(w=>plain(w).length>=3))];
    shuffle(V).slice(0,5).forEach(v=>{ const w=words(v.ar); const cand=w.map((x,i)=>i).filter(i=>plain(w[i]).length>=3); if(!cand.length) return;
      const bi=pick(cand); const a=Math.max(0,bi-4), b=Math.min(w.length,a+9);
      const shown=w.slice(a,b).map((x,i)=>i+a===bi?'<span style="display:inline-block;min-width:70px;border-bottom:3px solid var(--gold);margin:0 4px">&nbsp;</span>':x).join(' ');
      const wrong=shuffle(pool.filter(x=>plain(x)!==plain(w[bi]))).slice(0,3);
      steps.push({type:'quiz',kind:'Missing word',arQ:true,arOpts:true,q:'',qhtml:`<span style="font-family:Nunito;font-size:15px;color:var(--muted);display:block;text-align:left;direction:ltr">Verse ${v.n}${a>0||b<w.length?' (part)':''}:</span>${a>0?'… ':''}${shown}${b<w.length?' …':''}`,opts:[w[bi]].concat(wrong)}); });
  }
  if(g==='meaning'){
    for(let r=0;r<2;r++){ const pick4=shuffle(V).slice(0,4);
      steps.push({type:'match',kind:'Meaning match',arLeft:true,prompt:'Tap a verse, then its meaning.',pairs:(a=>pick4.map((v,i)=>[a[i],v.en.length>70?v.en.slice(0,68).replace(/\s\S*$/,'')+' …':v.en]))(snips(pick4.map(v=>v.ar),4))}); }
  }
  runSession({title:'Surah '+sr.en, steps, back:'surah', onDone:(c,n)=>{
    S.played[y]=S.played[y]||{}; S.played[y][g]=true; const pct=n?c/n:1; if(pct===1) S.perfect++; touchStreak(); save(); checkBadges();
    const st=pct>=.9?3:pct>=.7?2:1; result(st,c,n,()=>home('surah'),()=>surahGame(g)); }});
}

/* ---------- badges & settings ---------- */
function renderBadges(body){
  checkBadges();
  const y=S.year, topics=CONTENT[y]||[]; const stars=topics.reduce((a,t,i)=>a+(S.stars[y+'-'+i]||0),0);
  const el=$(`<div class="pad"><div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">${noor(70)}<div><h2 style="font-size:28px;color:var(--navy)">My badges</h2><span style="font-weight:700;color:var(--muted)">${Object.keys(S.badges).length} of ${BADGES.length} earned</span></div></div>
   <button class="btn navy" id="pc" style="margin-bottom:16px">My progress card for Seesaw</button>
   <div class="statrow" style="margin-bottom:16px"><div class="stat"><b>${S.xp}</b><span>Total XP</span></div><div class="stat"><b>${stars}/${topics.length*3}</b><span>Stars</span></div><div class="stat"><b>${liveStreak()}</b><span>Day streak</span></div></div>
   <div class="badges">${BADGES.map(b=>`<div class="badge ${S.badges[b[0]]?'':'lock'}">${badgeIcon(b[3],!S.badges[b[0]])}<b>${b[1]}</b><span>${b[2]}</span></div>`).join('')}</div></div>`);
  el.querySelector('#pc').onclick=progressCard;
  body.appendChild(el);
}
function progressCard(){
  checkBadges();
  const y=S.year, topics=CONTENT[y]||[], list=SURAHS[y]||[];
  const stars=topics.reduce((a,t,i)=>a+(S.stars[y+'-'+i]||0),0), done=topics.filter((t,i)=>S.stars[y+'-'+i]).length;
  const tot=list.reduce((a,s)=>a+s.v.length,0), tk=Object.values(S.verses[y]||{}).filter(Boolean).length;
  const pl=S.played[y]||{}, games=['order','next','missing','meaning'].filter(k=>pl[k]).length;
  const d=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  const el=$(`<div class="screen" style="background:linear-gradient(#FFF8E8,#DDF0FB)"><div class="gamehead"><button id="q" aria-label="Back">${I.x}</button><b style="font-family:'Baloo 2';font-size:20px;color:var(--navy)">My progress card</b></div>
   <div class="pad" style="padding-top:6px">
   <div class="pcard"><div class="ph">${noor(46)}<div style="flex:1"><h2>${esc(S.name)}</h2><span>Year ${y} · Islamic Education · Term 1</span></div><div style="text-align:right;font-size:12px;font-weight:700;opacity:.85">${d}</div></div>
   <div class="pb">
    <div class="statrow"><div class="stat"><b>${S.xp}</b><span>XP</span></div><div class="stat"><b>${stars}/${topics.length*3}</b><span>Stars</span></div><div class="stat"><b>${liveStreak()}</b><span>Day streak</span></div></div>
    <div class="psec">Surah target</div>
    <div class="prow"><span>${list.map(s=>'Surah '+esc(s.en)).join(' & ')}</span><span>${tk}/${tot} verses</span></div>
    <div class="prow"><span>Surah games played</span><span>${games}/4</span></div>
    ${topics.length?`<div class="psec">Topics (${done}/${topics.length} done)</div>`+topics.map((t,i)=>{const s=S.stars[y+'-'+i]||0;return `<div class="prow"><span>${i+1}. ${esc(t.t)}</span><span class="s">${[1,2,3].map(n=>I.star(16,n<=s?'#F2B61C':'#E2E8F0')).join('')}</span></div>`;}).join(''):''}
    <div class="psec">Badges: ${Object.keys(S.badges).length}/${BADGES.length}</div>
    <div class="prow" style="flex-wrap:wrap;justify-content:flex-start;font-size:13px">${BADGES.filter(b=>S.badges[b[0]]).map(b=>b[1]).join(' · ')||'None yet. Keep going!'}</div>
   </div></div>
   <div class="card" style="margin-top:16px;display:flex;gap:12px;align-items:center;font-weight:700;line-height:1.4"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2" stroke-linejoin="round" style="flex:none"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg><span>Take a <b>screenshot</b> of this card, then post it on <b>Seesaw</b> for Ms Wazir.</span></div>
   </div></div>`);
  el.querySelector('#q').onclick=()=>home('badges');
  show(el);
}
function settings(){
  const m=$(`<div class="modal"><div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:26px;color:var(--navy)">Settings</h2><button id="c">${I.x}</button></div>
   <div class="row"><div>Support mode<div class="note">Bigger text and 3 answer choices instead of 4</div></div><button class="switch ${S.support?'on':''}" id="sup"></button></div>
   <div class="row"><div>Sounds</div><button class="switch ${S.sound?'on':''}" id="snd"></button></div>
   <div class="row"><div>Change name or year</div><button class="speak" id="ch">Change</button></div>
   <div class="row" style="border:0"><div>Start again<div class="note">Clears progress on this device</div></div><button class="speak" id="rs" style="background:#FDE2E6;color:#B02A3D">Reset</button></div>
   <p class="note">Progress is saved on this device only.</p></div></div>`);
  const close=()=>m.remove();
  m.onclick=e=>{ if(e.target===m) close(); }; m.querySelector('#c').onclick=close;
  m.querySelector('#sup').onclick=e=>{S.support=!S.support;save();e.currentTarget.classList.toggle('on');};
  m.querySelector('#snd').onclick=e=>{S.sound=!S.sound;save();e.currentTarget.classList.toggle('on');};
  m.querySelector('#ch').onclick=()=>{close();welcome();};
  const rs=m.querySelector('#rs'); let armed=false;
  rs.onclick=()=>{ if(!armed){armed=true;rs.textContent='Tap again to confirm';return;} const keep={support:S.support,sound:S.sound}; S=Object.assign({name:'',year:null,xp:0,streak:0,last:null,days:{},stars:{},verses:{},played:{},badges:{},perfect:0},keep); save(); close(); welcome(); };
  document.body.appendChild(m);
}

/* ---------- boot ---------- */
if(S.name && S.year) home('path'); else welcome();
let lastW=window.innerWidth;
window.addEventListener('resize',()=>{ if(Math.abs(window.innerWidth-lastW)<40) return; lastW=window.innerWidth; const nav=document.querySelector('.nav button.on'); if(nav && nav.dataset.t==='path') home('path'); });
</script>
</body>
</html>
