<style>
:root{
  --navy:#1B2A4A; --navy2:#2C3E66; --gold:#F2B61C; --gold2:#E0A516; --cream:#FFF8E8;
  --sky:#DDF0FB; --mint:#DDF5E6; --pink:#FCE4EC; --lav:#E8E6FA; --peach:#FFE9D6;
  --green:#2FA36B; --red:#E0475B; --ink:#1F2937; --muted:#64708A; --card:#FFFFFF;
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--sky);font-size:17px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
h1,h2,h3,.disp{font-family:'Baloo 2','Nunito',sans-serif;margin:0;line-height:1.1}
.ar{font-family:'Amiri Quran','Amiri',serif;direction:rtl;line-height:2.1;font-weight:400 !important}
#app{max-width:520px;margin:0 auto;min-height:100%;position:relative;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:18px;font-weight:800;font-size:18px;
  background:var(--gold);color:var(--navy);box-shadow:0 5px 0 var(--gold2);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold2)}
.btn.navy{background:var(--navy);color:#fff;box-shadow:0 5px 0 #0E1830}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:0 5px 0 #CBD5E1}
.btn.green{background:var(--green);color:#fff;box-shadow:0 5px 0 #1E7A4E}
.btn:disabled{opacity:.45;pointer-events:none}

/* welcome */
.welcome{padding:28px 22px 30px;gap:18px;background:linear-gradient(#DDF0FB 0%,#FFF8E8 70%)}
.brand{text-align:center}
.brand h1{font-size:38px;color:var(--navy)}
.brand p{margin:4px 0 0;color:var(--muted);font-weight:700}
.field{background:#fff;border-radius:18px;padding:14px 16px;border:2.5px solid #E2E8F0;font-size:18px;font-family:inherit;width:100%;font-weight:700;color:var(--navy)}
.field:focus{outline:none;border-color:var(--gold)}
.lbl{font-weight:800;color:var(--navy);margin:2px 0 8px}
.yeargrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.yr{background:#fff;border-radius:16px;padding:12px 4px;font-weight:800;color:var(--navy);box-shadow:0 4px 0 #CBD5E1;text-align:center;font-size:15px}
.yr b{display:block;font-family:'Baloo 2';font-size:26px;line-height:1}
.yr.on{background:var(--navy);color:#fff;box-shadow:0 4px 0 #0E1830}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;position:sticky;top:0;z-index:5;background:rgba(221,240,251,.92);backdrop-filter:blur(6px)}
.pill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;color:var(--navy);box-shadow:0 2px 0 #CBD5E1;font-size:16px}
.hello{flex:1;min-width:0}
.hello b{display:block;font-family:'Baloo 2';font-size:21px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello span{font-size:13px;color:var(--muted);font-weight:700}
.iconbtn{width:42px;height:42px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 2px 0 #CBD5E1}

/* path */
.pathwrap{position:relative;padding:8px 0 150px}
.pathsvg{position:absolute;left:0;top:0;pointer-events:none}
.node{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;display:grid;place-items:center;
  background:#fff;border:5px solid var(--navy);box-shadow:0 6px 0 rgba(27,42,74,.25);font-family:'Baloo 2';font-weight:800;font-size:26px;color:var(--navy);z-index:2}
.node.done{background:var(--gold);border-color:#fff}
.node.surah{background:var(--green);border-color:#fff;color:#fff}
.node.next{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.node .stars{position:absolute;bottom:-14px;display:flex;gap:1px}
.tag{position:absolute;z-index:3;width:150px;background:#fff;border-radius:14px;padding:8px 10px;box-shadow:0 3px 0 #CBD5E1;font-size:13.5px;line-height:1.25}
.tag b{display:block;color:var(--navy);font-size:14.5px}
.tag i{font-style:normal;color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.startbub{position:absolute;z-index:4;background:var(--navy);color:#fff;font-weight:800;font-size:13px;padding:4px 10px;border-radius:10px;transform:translate(-50%,-100%);white-space:nowrap}
.startbub:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--navy);border-bottom:0}
.hills{position:absolute;left:0;right:0;bottom:0;height:150px;pointer-events:none}

/* bottom nav */
.nav{position:sticky;bottom:0;display:flex;background:#fff;border-top:2px solid #E2E8F0;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:6}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--muted);padding:4px 0;border-radius:12px}
.nav button.on{color:var(--navy);background:var(--cream)}

/* cards & game */
.pad{padding:16px 18px 24px}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 4px 0 #CBD5E1}
.gamehead{display:flex;align-items:center;gap:12px;padding:14px 16px 6px}
.bar{flex:1;height:14px;border-radius:99px;background:#fff;overflow:hidden;box-shadow:inset 0 0 0 2px #E2E8F0}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s}
.kind{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.qtext{font-family:'Baloo 2';font-size:23px;color:var(--navy);line-height:1.2;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:#fff;border-radius:16px;padding:14px 16px;font-weight:700;text-align:left;box-shadow:0 4px 0 #CBD5E1;border:2.5px solid transparent;font-size:17px;line-height:1.3}
.opt.ar{text-align:right;font-size:22px;line-height:1.9;padding:8px 16px}
.opt.right{border-color:var(--green);background:#E7F7EE}
.opt.wrong{border-color:var(--red);background:#FDECEE}
.opt.sel{border-color:var(--navy);background:var(--cream)}
.opt.gone{opacity:0;pointer-events:none;transition:opacity .3s}
.feedback{position:sticky;bottom:0;padding:14px 18px calc(16px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;animation:fade .2s}
.feedback.ok{background:#D5F2E1}.feedback.no{background:#FDE2E6}
.feedback h3{font-size:22px;margin-bottom:8px}
.feedback.ok h3{color:#1E7A4E}.feedback.no h3{color:#B02A3D}
.feedback p{margin:0 0 12px;font-weight:700}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.matchgrid .opt{font-size:15px;padding:12px;text-align:center;min-height:62px;display:flex;align-items:center;justify-content:center}
.matchgrid .opt.ar{font-size:18px;line-height:1.8}
.sortitem{font-family:'Baloo 2';font-size:24px;color:var(--navy);text-align:center;padding:26px 16px;background:#fff;border-radius:22px;box-shadow:0 4px 0 #CBD5E1;margin:8px 0 18px}
.bins{display:grid;gap:10px}
.bin{padding:16px 10px;border-radius:18px;font-weight:800;font-size:16px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.orderdone{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;min-height:20px}
.orderdone div{background:#E7F7EE;border:2px solid var(--green);border-radius:14px;padding:10px 12px;font-weight:700;display:flex;gap:10px;align-items:center}
.orderdone div.ar{font-size:19px;line-height:1.8}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
.learn li{margin:0 0 12px;line-height:1.45;font-weight:600}
.learn ul{padding-left:20px;margin:6px 0 0}
.speak{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--navy);background:var(--cream);border-radius:999px;padding:6px 12px;font-size:14px}

/* result */
.result{align-items:center;text-align:center;padding:30px 22px;gap:14px;background:linear-gradient(#FFF8E8,#DDF0FB)}
.bigstars{display:flex;gap:6px;margin:6px 0}
.statrow{display:flex;gap:10px;width:100%}
.stat{flex:1;background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 0 #CBD5E1}
.stat b{display:block;font-family:'Baloo 2';font-size:28px;color:var(--navy)}
.stat span{font-size:13px;font-weight:800;color:var(--muted)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* surah */
.surahhead{background:var(--green);color:#fff;border-radius:var(--r);padding:18px;box-shadow:0 4px 0 #1E7A4E}
.surahhead .ar{font-size:34px;line-height:1.5}
.verse{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 3px 0 #CBD5E1;margin-bottom:10px}
.verse .ar{font-size:24px;text-align:right}
.verse p{margin:4px 0 8px;color:var(--muted);font-size:14.5px;font-weight:600}
.vnum{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--gold);font-size:13px;font-weight:800;color:var(--navy);margin-left:4px;font-family:'Nunito'}
.tick{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--navy)}
.tick .bx{width:26px;height:26px;border-radius:8px;border:2.5px solid #CBD5E1;display:grid;place-items:center;background:#fff}
.tick.on .bx{background:var(--green);border-color:var(--green)}
.gamegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.gtile{border-radius:20px;padding:16px 12px;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.12);min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.gtile b{font-family:'Baloo 2';font-size:19px;color:var(--navy);line-height:1.1}
.gtile span{font-size:13px;font-weight:700;color:var(--ink);opacity:.8}
.prog{height:12px;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--gold)}
.seg{display:flex;background:#fff;border-radius:14px;padding:4px;gap:4px;margin-bottom:12px;box-shadow:0 2px 0 #CBD5E1}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:800;color:var(--muted);font-size:14px}
.seg button.on{background:var(--navy);color:#fff}

/* progress card */
.pcard{background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 6px 0 #CBD5E1;border:3px solid var(--gold)}
.pcard .ph{background:var(--navy);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:12px}
.pcard .ph h2{font-size:24px}.pcard .ph span{font-size:13px;font-weight:700;opacity:.85}
.pcard .pb{padding:14px 16px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;border-bottom:1.5px dashed #E2E8F0;font-size:13.5px;font-weight:700;line-height:1.25}
.pcard .stat{padding:8px}.pcard .stat b{font-size:22px}
.prow:last-child{border:0}
.prow .s{display:flex;flex:none}
.psec{font-family:'Baloo 2';font-size:17px;color:var(--navy);margin:12px 0 2px}
/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.badge{background:#fff;border-radius:20px;padding:14px 8px;text-align:center;box-shadow:0 4px 0 #CBD5E1}
.badge b{display:block;font-size:13.5px;color:var(--navy);margin-top:6px;line-height:1.15}
.badge span{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:3px;line-height:1.2}
.badge.lock{opacity:.45;filter:grayscale(1)}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:16px;font-weight:800;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;animation:fade .25s}
.modal{position:fixed;inset:0;background:rgba(27,42,74,.45);display:grid;place-items:end center;z-index:40}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:fade .2s}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1.5px solid #EEF2F7;font-weight:700}
.switch{width:52px;height:30px;border-radius:99px;background:#CBD5E1;position:relative;flex:none}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on{background:var(--green)}.switch.on:after{left:25px}
.note{font-size:13px;color:var(--muted);font-weight:600;line-height:1.4}
.support .opt{font-size:20px;padding:18px}
.support .qtext{font-size:26px}
</style>
</head>

 {t:"I Love Good for My Brother", u:"Topic 4 · Noble Hadith",

 {t:"Surah Al-ʿAlaq", u:"Weeks 2–3 · The Noble Qur'an",

     ["How does the surah end?",["Prostrate and draw near","Go to sleep","Run away","Stay silent"]]],
  m:[["ʿAlaq","Clinging clot"],["Al-qalam","The pen"],["Yaṭghā","Transgresses"],["Ar-rujʿā","The return"],["Az-zabāniyah","The guards of Hell"]]},
 {t:"Kindness to Parents", u:"Weeks 3–4 · Islamic Values",

  q:[["Which small word must we not say to our parents?",["Uff","Thank you","Salām","Yes"]],
     ["Who did the Prophet ﷺ name three times as deserving our best treatment?",["Your mother","Your teacher","Your friend","Your neighbour"]],

 {t:"Etiquette of Recitation", u:"Weeks 4–5 · The Noble Qur'an",
  L:["Have wuḍūʾ to touch the muṣḥaf and sit in a clean place.","Begin with “Aʿūdhu billāhi mina sh-shayṭāni r-rajīm” and say Bismillāh at the start of a surah.","Recite slowly and clearly (tartīl). When the Qur'an is recited, listen quietly."],
  q:[["What does tartīl mean?",["Reciting slowly and clearly","Reciting very fast","Reciting silently","Reciting once a year"]],
     ["When the Qur'an is recited, we should…",["Listen quietly","Talk to friends","Play games","Leave the room"]],
     ["The Prophet ﷺ said the best of you are those who…",["Learn the Qur'an and teach it","Run fastest","Have the most money","Sleep early"]]],
  o:["Make wuḍūʾ","Sit in a clean place","Say Aʿūdhu billāh","Say Bismillāh","Recite slowly with tartīl"]},
 {t:"Lady Khadījah", u:"Weeks 5–7 · Islamic Figures",
  L:["Khadījah was the Prophet's ﷺ first wife and a successful trader of Makkah.","She was the first person to believe in him.","She comforted and supported him with her wealth. Her death came in the Year of Sorrow."],
  q:[["Who was the first person to believe in the Prophet ﷺ?",["Khadījah","Abū Bakr","ʿUmar","Ḥamzah"]],
     ["What was Khadījah's work?",["Trade","Farming","Teaching","Medicine"]],
     ["Which daughter of the Prophet ﷺ was Khadījah's?",["Fāṭimah","ʿĀʾishah","Ḥafṣah","Asmāʾ"]]],
  m:[["First believer","Khadījah"],["Her work","Trade"],["She comforted him","After the first revelation"],["The year she died","The Year of Sorrow"]]},
 {t:"Belief in the Angels", u:"Week 8 · Unit 2",
  L:["Angels are created from light. They obey Allah and never disobey Him.","They do not eat, drink or sleep.","Each has a job: Jibrīl brings revelation, Mīkāʾīl rain, Isrāfīl blows the Trumpet."],
  q:[["Angels are created from…",["Light","Clay","Fire","Water"]],
     ["Which angel brought the revelation?",["Jibrīl","Mīkāʾīl","Isrāfīl","Mālik"]],
     ["Do angels ever disobey Allah?",["Never","Sometimes","On Fridays","When tired"]]],
  m:[["Jibrīl","Brings revelation"],["Mīkāʾīl","Rain and provision"],["Isrāfīl","Blows the Trumpet"],["Raqīb and ʿAtīd","Record our deeds"]],
  s:[["Angels","Humans"],[["Created from light",0],["Never disobey Allah",0],["Do not eat or drink",0],["Created from clay",1],["Can make mistakes",1],["Need to sleep",1]]]},
 {t:"Conditions & Invalidators of Prayer", u:"Week 9 · Acts of Worship",
  L:["Conditions of prayer: wuḍūʾ, clean body, clothes and place, covering properly, facing the qiblah and the prayer time having begun.","Prayer is broken by talking on purpose, eating or drinking, laughing out loud or breaking wuḍūʾ."],
  q:[["Ahmed laughed out loud during ṣalāh. What should he do?",["Repeat the prayer","Carry on, it's fine","Make sujūd only","Say Āmīn"]],
     ["Sara prayed Ẓuhr before its time began. Is it valid?",["No, she must pray it in its time","Yes, always","Yes, if she was quick","Only on weekends"]],
     ["Which of these is a condition of prayer?",["Facing the qiblah","Wearing new clothes","Praying very fast","Praying with shoes"]]],
  s:[["Condition of prayer","Breaks the prayer"],[["Having wuḍūʾ",0],["Facing the qiblah",0],["Clean clothes",0],["Prayer time has begun",0],["Talking on purpose",1],["Eating",1],["Laughing out loud",1]]]},
 {t:"Surah At-Tīn", u:"Week 10 · The Noble Qur'an",
  L:["Allah swears by the fig, the olive, Mount Sinai and the secure city, Makkah.","He created people in the best form (aḥsani taqwīm).","Believers who do good get a never-ending reward. Allah is the most just of judges."],
  q:[["What is the “secure city”?",["Makkah","Madinah","Jerusalem","Dubai"]],
     ["Who gets a never-ending reward?",["Those who believe and do good deeds","Everyone","Only kings","Only the rich"]],
     ["The surah ends: Is not Allah the most … of judges?",["Just","Fast","Quiet","Young"]]],
  m:[["At-Tīn","The fig"],["Az-zaytūn","The olive"],["Al-balad al-amīn","The secure city"],["Aḥsani taqwīm","The best form"],["Ghayru mamnūn","Never-ending"]]},
 {t:"Reciting the Qur'an Well", u:"Week 12 · Noble Hadith",
  L:["The one skilled in the Qur'an is with the noble, righteous scribes (the angels).","The one who recites with difficulty, stumbling, gets two rewards.","So keep practising: every effort is rewarded."],
  q:[["The skilled reciter will be with…",["The noble, righteous scribes","The kings","The traders","No one"]],
     ["The one who finds reciting hard gets…",["Two rewards","No reward","Half a reward","A warning"]],
     ["Reciting feels hard today. What should you do?",["Keep practising","Give up","Stop forever","Only listen to music"]]],
  m:[["Al-māhir","Skilled"],["As-safarah","The scribes (angels)"],["Al-kirām al-bararah","Noble and righteous"],["Yatataʿtaʿ","Stumbles"]]}
],
5: [
 {t:"Surah Al-Burūj", u:"Weeks 1–2 · The Noble Qur'an",
  L:["Allah swears by the sky with great stars, the promised Day and the witnesses.","The People of the Trench threw believers into fire only because they believed in Allah.","The surah was revealed to comfort the believers in Makkah. The believers win the great success."],
  q:[["Why were the believers punished?",["Only because they believed in Allah","They stole","They lied","They were lazy"]],
     ["Why was the surah revealed?",["To comfort believers being hurt in Makkah","To teach maths","To describe the sea","To talk about trade"]],
     ["What do the patient believers win?",["The great success","Gold","A palace in Makkah","Nothing"]]],
  m:[["Al-burūj","The great stars"],["Al-yawm al-mawʿūd","The promised Day"],["Al-ukhdūd","The trench"],["Al-fawz al-kabīr","The great success"]],
  o:["A boy is trained by the king's magician","He meets a monk and believes in Allah","The king fails to harm him","The boy says: shoot me saying “In the name of Allah, Lord of the boy”","The people believe and the king digs trenches of fire"]},
 {t:"The Strong Believer", u:"Weeks 3–4 · Noble Hadith",
  L:["“The strong believer is better and more beloved to Allah than the weak believer, and there is good in both.”","“Be keen on what benefits you, seek help from Allah and do not give up.”","If something goes wrong, say: “Allah decreed it and did what He willed”, not “if only”."],
  q:[["Who is more beloved to Allah?",["The strong believer","The one who gives up","The loudest person","The richest person"]],
     ["What does iḥriṣ mean?",["Be keen","Be quiet","Be fast","Be angry"]],
     ["Something went wrong. What should you say?",["Qadarullāh wa mā shāʾa faʿal","If only I had…","It's all their fault","I quit"]]],
  s:[["Strong believer","Weak habit"],[["Keeps trying after failing",0],["Asks Allah for help",0],["Does what benefits him",0],["Helps others",0],["Gives up quickly",1],["Says “if only” and blames",1]]]},
 {t:"The Beginning of the Call to Islam", u:"Weeks 5–6 · Prophetic Biography",
  L:["For about three years the call was secret, meeting in Dār al-Arqam.","The first Muslims included Khadījah, Abū Bakr, ʿAlī and Zayd ibn Ḥārithah.","Then the Prophet ﷺ called openly from Mount Ṣafā, with wisdom and kind advice."],
  q:[["Where did the early Muslims meet in secret?",["Dār al-Arqam","Cave of Thawr","Masjid an-Nabawī","Ṭāʾif"]],
     ["For about how long was the call secret?",["Three years","Ten years","One week","Forty years"]],
     ["Where did the Prophet ﷺ first call people openly?",["Mount Ṣafā","Mount Uḥud","Mount Sinai","ʿArafah"]]],
  m:[["Khadījah","First woman to believe"],["Abū Bakr","First free man to believe"],["ʿAlī","First boy to believe"],["Zayd ibn Ḥārithah","First freed slave to believe"]]},
 {t:"Zaynab bint Khuzaymah", u:"Weeks 7–8 · Biography & Figures",
  L:["Zaynab was called Umm al-Masākīn, the Mother of the Poor, for her generosity.","She married the Prophet ﷺ in Madinah after her husband was martyred at Uḥud.","She died a few months later and is buried in al-Baqīʿ. Islam honours women and their good deeds."],
  q:[["What was Zaynab's title?",["Mother of the Poor","Mother of Kings","The Poet","The Traveller"]],
     ["Why was she given this title?",["She fed and helped the poor","She was a queen","She wrote books","She was very tall"]],
     ["Where is she buried?",["Al-Baqīʿ in Madinah","Makkah","Ṭāʾif","Jerusalem"]]],
  m:[["Umm al-Masākīn","Mother of the Poor"],["Al-Baqīʿ","Where she is buried"],["Mothers of the Believers","Title of the Prophet's wives"],["Generosity","Her best-known quality"]]},
 {t:"Belief in the Revealed Books", u:"Weeks 9–10 · Islamic Creed",
  L:["Allah sent books to His messengers: the Tawrāh, the Injīl, the Zabūr, the Scrolls and the Qur'an.","The Qur'an is the last book, and Allah promised to preserve it (Al-Ḥijr 9).","“We have made the Qur'an easy to remember” (Al-Qamar 17)."],
  q:[["Which book did Allah promise to preserve?",["The Qur'an","The Zabūr","The Scrolls","None"]],
     ["Which is the last revealed book?",["The Qur'an","The Tawrāh","The Injīl","The Zabūr"]],
     ["Which surah says the Qur'an is made easy to remember?",["Al-Qamar","Al-Kawthar","An-Nās","Al-Fīl"]]],
  m:[["Tawrāh","Mūsā"],["Injīl","ʿĪsā"],["Zabūr","Dāwūd"],["Scrolls (Ṣuḥuf)","Ibrāhīm"],["Qur'an","Muhammad ﷺ"]]},
 {t:"The Importance of Obligatory Prayer", u:"Weeks 11–12 · Acts of Worship",
  L:["Prayer is the second pillar of Islam and the first deed we are asked about on the Day of Judgement.","The five daily prayers were made obligatory on the night of the Miʿrāj.","Manners: wuḍūʾ, clean clothes, going early and praying calmly with khushūʿ."],
  q:[["Which pillar of Islam is prayer?",["The second","The first","The fourth","The fifth"]],
     ["What is the first deed we are asked about?",["Prayer","Fasting","Zakāh","Hajj"]],
     ["When were the five prayers made obligatory?",["On the night of the Miʿrāj","At the Battle of Badr","In Ramadan","At ʿArafah"]]],
  o:["Fajr","Ẓuhr","ʿAṣr","Maghrib","ʿIshāʾ"],
  m:[["Fajr","2 rakʿahs"],["Maghrib","3 rakʿahs"],["Ẓuhr","4 rakʿahs"],["Witr (smallest)","1 rakʿah"]]},
 {t:"The Best of You in Character", u:"Weeks 13–14 · Noble Hadith",
  L:["The Prophet ﷺ was never indecent or vulgar.","He said: “The best of you are those with the best character.”","Good character means kind words, honesty, patience and smiling."],
  q:[["Who are the best of you?",["Those with the best character","The strongest","The richest","The tallest"]],
     ["Which is good character?",["Speaking kindly","Mocking others","Swearing","Lying"]],
     ["Was the Prophet ﷺ ever vulgar?",["Never","Sometimes","When angry","With enemies"]]],
  m:[["Fāḥish","Indecent"],["Mutafaḥḥish","Vulgar on purpose"],["Khiyārukum","The best of you"],["Akhlāq","Character"]],
  s:[["Good character","Bad character"],[["Kind words",0],["Honesty",0],["Patience",0],["Smiling",0],["Swearing",1],["Mocking others",1]]]}
],
6: [
 {t:"Surah Al-Infiṭār (1–19)", u:"Weeks 1–2 · The Noble Qur'an",
  L:["On the Last Day the sky splits apart, the stars scatter, the seas burst and the graves are overturned.","“O mankind, what has deceived you about your Lord, the Generous?”","Noble recorders write our deeds. The righteous are in bliss and the wicked in the Fire."],
  q:[["Who writes down our deeds?",["The noble recorders","Our friends","Our teachers","No one"]],
     ["Which name of Allah is in verse 6?",["Al-Karīm (the Generous)","Al-Malik","Al-Quddūs","Al-Wadūd"]],
     ["On that Day, the command belongs to…",["Allah alone","The kings","Everyone","The angels"]]],
  m:[["Infaṭarat","Split apart"],["Intatharat","Scattered"],["Kirāman kātibīn","Noble recorders"],["Al-abrār","The righteous"],["An-naʿīm","Bliss"]]},
 {t:"The Truly Bankrupt", u:"Week 3 · Noble Hadith",
  L:["The Companions thought a bankrupt person was someone with no money.","The Prophet ﷺ said the truly bankrupt comes with prayer and fasting, but had insulted and harmed people, so his good deeds are given to them.","Following a bad deed with a good deed wipes it away."],
  q:[["Who is truly bankrupt?",["Someone whose good deeds go to the people he wronged","Someone with no money","Someone who lost his job","Someone who is ill"]],
     ["What did the Companions first think?",["Someone with no money","Someone who prays a lot","A king","A traveller"]],
     ["What wipes away a bad deed?",["Following it with a good deed","Forgetting it","Hiding it","Blaming someone"]]],
  s:[["Hurting with words","Hurting with actions"],[["Insulting someone",0],["Backbiting",0],["Spreading a lie about someone",0],["Hitting someone",1],["Taking someone's things",1],["Breaking someone's property",1]]]},
 {t:"Calling the People of Ṭāʾif", u:"Weeks 4–5 · Prophetic Biography",
  L:["After the Year of Sorrow, the Prophet ﷺ went to Ṭāʾif with Zayd ibn Ḥārithah.","The leaders refused and people threw stones at him.","He made duʿāʾ, and refused the angel's offer to crush them, hoping their children would worship Allah."],
  q:[["Who went with the Prophet ﷺ to Ṭāʾif?",["Zayd ibn Ḥārithah","ʿUmar","Bilāl","Ḥamzah"]],
     ["What did he say to the angel of the mountains?",["No — I hope their children will worship Allah","Yes, crush them","Wait a year","Ask Jibrīl"]],
     ["Which quality do we learn most here?",["Patience and mercy","Anger","Revenge","Fear"]]],
  o:["The Year of Sorrow","He travels to Ṭāʾif with Zayd","He invites the leaders of Thaqīf","They refuse and stones are thrown","He makes duʿāʾ and forgives them","He returns to Makkah"]},
 {t:"Persisting in Good Deeds", u:"Weeks 6–7 · Islamic Values",
  L:["“The most beloved deeds to Allah are those done regularly, even if small.”","Start small, keep a sincere intention, choose good friends and make duʿāʾ.","Consistency builds good habits and brings us closer to Allah."],
  q:[["Which deeds are most beloved to Allah?",["Regular ones, even if small","Huge ones done once","Deeds people see","Only deeds in Ramadan"]],
     ["Best way to start a new good habit?",["Start small and keep going","Do everything at once","Wait until next year","Tell everyone and stop"]],
     ["A fruit of being consistent is…",["Closeness to Allah","Getting bored","Losing friends","Being proud"]]],
  s:[["Helps me keep going","Stops me"],[["Starting small",0],["Good friends",0],["Making duʿāʾ",0],["Having a plan",0],["Doing too much then quitting",1],["Laziness",1]]]},
 {t:"Belief in the Last Day", u:"Week 8 · Islamic Creed",
  L:["Belief in the Last Day is the fifth pillar of īmān.","The Trumpet is blown, people are raised, gathered, and their deeds are weighed.","Believing in it makes a believer careful and hopeful in daily life."],
  q:[["Which pillar of īmān is the Last Day?",["The fifth","The first","The second","The sixth"]],
     ["What happens to deeds on that Day?",["They are weighed on the Scale","They disappear","They are forgotten","They are sold"]],
     ["How does this belief change a believer?",["He tries to do good and avoid wrong","He stops caring","He sleeps more","Nothing changes"]]],
  o:["The Trumpet is blown","People are raised from their graves","Everyone is gathered","Books of deeds are given","Deeds are weighed on the Scale","People cross the Ṣirāṭ"]},
 {t:"Congregational Prayer", u:"Weeks 9–10 · Acts of Worship",
  L:["Praying in congregation is 27 times better than praying alone.","A latecomer (masbūq) says takbīr and joins the imam in whatever position he is in.","You catch a rakʿah if you reach the rukūʿ. After the imam's salām, stand and complete what you missed."],
  q:[["How many times better is praying in congregation?",["27","2","10","100"]],
     ["You catch a rakʿah if you join before the imam rises from…",["Rukūʿ","Sujūd","Tashahhud","Salām"]],
     ["After the imam says salām, the masbūq…",["Stands to complete the missed rakʿahs","Leaves","Says salām too","Starts again"]]],
  o:["Make the opening takbīr while standing","Join the imam in his position","Follow the imam","When the imam says salām, stand up","Complete the missed rakʿahs"]},
 {t:"The Night Journey & Ascension", u:"Weeks 11–12 · Prophetic Biography",
  L:["Al-Isrāʾ: the journey from Masjid al-Ḥarām to Masjid al-Aqṣā on al-Burāq.","Al-Miʿrāj: the ascent through the seven heavens to Sidrat al-Muntahā.","The five daily prayers were given that night. Abū Bakr believed at once and was called aṣ-Ṣiddīq."],
  q:[["Where did the Night Journey begin?",["Masjid al-Ḥarām in Makkah","Madinah","Ṭāʾif","Cave Ḥirāʾ"]],
     ["What gift was given on this night?",["The five daily prayers","Fasting Ramadan","Zakāh","Hajj"]],
     ["Who was called aṣ-Ṣiddīq for believing straight away?",["Abū Bakr","ʿUmar","ʿUthmān","Bilāl"]]],
  m:[["Al-Isrāʾ","Journey from Makkah to Jerusalem"],["Al-Miʿrāj","Ascent through the heavens"],["Al-Burāq","The animal he rode"],["Sidrat al-Muntahā","The Lote Tree of the Utmost Boundary"]],
  o:["From Masjid al-Ḥarām","To Masjid al-Aqṣā","He leads the prophets in prayer","He rises through the seven heavens","The five prayers are given","He returns to Makkah"]},
 {t:"Loving Allah", u:"Week 13 · Islamic Values",
  L:["“Say: If you love Allah, follow me, and Allah will love you” (Āl ʿImrān 31).","Allah loves those who do good, the patient, those who repent and those who trust Him.","Love of Allah lives in the heart and shows in our actions."],
  q:[["How do we show we love Allah (Āl ʿImrān 31)?",["By following the Prophet ﷺ","By staying quiet","By being rich","By travelling"]],
     ["Where does love of Allah show?",["In the heart and in actions","Only in words","Only on Eid","Nowhere"]],
     ["Allah loves those who are…",["Patient","Proud","Lazy","Unkind"]]],
  m:[["Al-muḥsinīn","Those who do good"],["Aṣ-ṣābirīn","The patient"],["At-tawwābīn","Those who repent"],["Al-mutawakkilīn","Those who trust Allah"]]}
],
7: [
 {t:"Surah As-Sajdah (1–12)", u:"Weeks 1–2 · The Noble Qur'an",
  L:["It opens with Alif-Lām-Mīm, letters that challenge the Arabs: the Qur'an uses their letters, yet no one can produce its like.","Allah created the heavens and earth in six days; a day with Him is like a thousand years of ours.","Man was made from clay, then from an extract of fluid. The One who created first can bring back to life."],
  q:[["Which disjointed letters open the surah?",["Alif-Lām-Mīm","Yā-Sīn","Ṭā-Hā","Qāf"]],
     ["In how many days were the heavens and earth created?",["Six","Seven","Two","Forty"]],
     ["Best proof of resurrection in the verses?",["The One who created the first time can create again","People say so","Dreams","Old stories"]]],
  m:[["Iftarāhu","He fabricated it"],["Yaʿruju ilayhi","Ascends to Him"],["Sulālah","Extract"],["Ṭīn","Clay"],["Malak al-mawt","The angel of death"]]},
 {t:"Volunteering: Worship and Belonging", u:"Weeks 3–4 · Values & Manners",
  L:["Volunteering is giving your time and effort freely, seeking Allah's reward.","“The most beloved people to Allah are those most beneficial to people.”","Fields include the environment, health, education, caring for the elderly and relief work."],
  q:[["Who are the most beloved people to Allah?",["Those most beneficial to people","Those with most followers","The richest","The loudest"]],
     ["Volunteering is done…",["Freely, seeking Allah's reward","Only for money","Only for praise","Only once"]],
     ["Which is a school volunteering idea?",["A beach or campus clean-up","Skipping lessons","Selling homework","Nothing"]]],
  s:[["Benefit for me","Benefit for society"],[["Builds confidence",0],["Earns reward",0],["Learn new skills",0],["Stronger community",1],["Helps people in need",1],["Cleaner environment",1]]]},
 {t:"Obligations, Sunnahs & Disliked Acts of Prayer", u:"Weeks 5–6 · Acts of Worship",
  L:["Pillars (arkān) must be done, e.g. Al-Fātiḥah, rukūʿ and sujūd.","Sunnahs bring extra reward, e.g. the opening duʿāʾ and raising the hands.","Disliked acts (makrūhāt) include looking around and fidgeting. Forgetting is repaired with sujūd as-sahw."],
  q:[["You forgot the first tashahhud. What repairs it?",["Sujūd as-sahw","Leaving the prayer","Nothing","Praying faster"]],
     ["What is sujūd as-sahw?",["Two prostrations for forgetfulness","An extra rakʿah","A duʿāʾ after Fajr","The night prayer"]],
     ["Which is disliked (makrūh) in prayer?",["Looking around","Reciting Al-Fātiḥah","Rukūʿ","Facing the qiblah"]]],
  s:[["Pillar","Sunnah","Disliked"],[["Reciting Al-Fātiḥah",0],["Rukūʿ",0],["Sujūd",0],["The opening duʿāʾ",1],["Raising the hands at takbīr",1],["Right hand over the left",1],["Looking around",2],["Fidgeting with clothes",2]]]},
 {t:"The UAE in the Service of the World", u:"Weeks 7–8 · Identity",
  L:["Sheikh Zayed built a legacy of giving and helping others.","The Emirates Red Crescent delivers humanitarian relief around the world.","The UAE named 2017 the Year of Giving and 2019 the Year of Tolerance."],
  q:[["Which values shine in the UAE's approach?",["Tolerance and giving","Pride and fame","Isolation","Competition only"]],
     ["Which year was the Year of Tolerance?",["2019","2001","2030","1971"]],
     ["What does the Emirates Red Crescent do?",["Humanitarian relief","Car racing","Banking","Tourism ads"]]],
  m:[["2017","Year of Giving"],["2019","Year of Tolerance"],["Emirates Red Crescent","Relief organisation"],["Sheikh Zayed","Founding father known for giving"]]},
 {t:"Hold Yourselves to Account", u:"Weeks 9–10 · Noble Hadith",
  L:["On the Day of Judgement a person will not move until asked about his life, knowledge, wealth and body.","ʿUmar said: “Hold yourselves to account before you are held to account.”","A daily self-check chart helps us improve our behaviour."],
  q:[["Who said: “Hold yourselves to account before you are held to account”?",["ʿUmar ibn al-Khaṭṭāb","Abū Lahab","Fir'awn","Qārūn"]],
     ["What are we asked about our knowledge?",["What we did with it","How long it took","Who taught us","Its price"]],
     ["Best daily habit from this hadith?",["Reviewing my day before sleeping","Ignoring mistakes","Blaming others","Sleeping late"]]],
  m:[["Life","How he spent it"],["Knowledge","What he did with it"],["Wealth","How he earned and spent it"],["Body","How he wore it out"]]},
 {t:"Life in Madinah after the Hijrah", u:"Weeks 11–12 · Biography",
  L:["The Prophet ﷺ first built the mosque at Qubāʾ, then Masjid an-Nabawī.","He joined the Muhājirūn and Anṣār in brotherhood (muʾākhāh).","ʿAbd ar-Raḥmān ibn ʿAwf, offered half of Saʿd's wealth, said: “Show me the market.”"],
  q:[["What did the Prophet ﷺ build first in Madinah?",["Masjid an-Nabawī","A market","A palace","A wall"]],
     ["What was Madinah called before?",["Yathrib","Ṭāʾif","Ḥīrah","Tabūk"]],
     ["What did ʿAbd ar-Raḥmān ibn ʿAwf ask for?",["Show me the market","Give me your house","Give me money","Make me a leader"]]],
  m:[["Muhājirūn","Emigrants from Makkah"],["Anṣār","Helpers of Madinah"],["Muʾākhāh","Brotherhood"],["Yathrib","Old name of Madinah"]],
  o:["Arrives at Qubāʾ and builds its mosque","Enters Madinah","Builds Masjid an-Nabawī","Joins Muhājirūn and Anṣār in brotherhood","Writes the Charter of Madinah"]}
],
8: [
 {t:"Surah Qāf (1–15)", u:"Weeks 1–2 · The Noble Qur'an",
  L:["Allah swears by the glorious Qur'an. The disbelievers were amazed that a warner came from among them.","He points to the sky without cracks, the mountains, the tall palm trees and rain reviving dead land.","“Thus is the coming out” — the resurrection is as real as plants coming back to life. “Were We tired by the first creation?”"],
  q:[["By what does Allah swear?",["The glorious Qur'an","The fig","The dawn","Time"]],
     ["Which sign in nature proves the resurrection?",["Rain bringing dead land to life","Wind","Fire","Sand"]],
     ["What do the verses teach about dialogue?",["Use clear evidence calmly","Shout louder","Mock people","Avoid talking"]]],
  m:[["Al-majīd","Glorious"],["Marīj","Confused"],["Bāsiqāt","Lofty (palm trees)"],["Al-khurūj","The coming out (resurrection)"],["Aṣḥāb al-Aykah","Companions of the Thicket"]]},
 {t:"Those in the Shade of the Most Merciful", u:"Weeks 3–4 · Noble Hadith",
  L:["Seven people will be shaded by Allah on a Day with no shade but His.","They include a just ruler, a youth raised in worship, a person attached to the mosques and two who love each other for Allah.","Also one who says “I fear Allah”, one who gives charity secretly and one whose eyes overflowed remembering Allah alone."],
  q:[["How many people are in the hadith?",["Seven","Three","Ten","Forty"]],
     ["The secret charity is so hidden that…",["The left hand doesn't know what the right gives","No one is given it","It's given at night only","It's very small"]],
     ["Who among the seven fits a student best?",["A youth raised in the worship of Allah","A ruler","A trader","A traveller"]]],
  m:[["A just ruler","Justice"],["A youth raised in worship","Devotion from a young age"],["A heart attached to mosques","Love of prayer"],["Secret charity","Sincerity"],["Eyes that overflowed","Remembering Allah alone"]]},
 {t:"Proofs of the Oneness of Allah", u:"Weeks 5–6 · Islamic Creed",
  L:["Every child is born on the fiṭrah, a natural inclination to believe in Allah.","“Had there been gods besides Allah in the heavens and earth, both would have been ruined” (Al-Anbiyāʾ 22).","The order and balance of the universe point to one Creator."],
  q:[["What is the fiṭrah?",["A natural inclination to believe in Allah","A type of food","A festival","A prayer time"]],
     ["What does Al-Anbiyāʾ 22 argue?",["More than one god would ruin the universe","The earth is flat","The stars are gods","Nothing"]],
     ["The balance of the universe shows…",["One wise Creator","Pure chance","Many creators","Nothing"]]],
  s:[["Rational proof","Textual proof"],[["The order and balance of the universe",0],["Nothing comes from nothing",0],["Design in the human body",0],["Surah Al-Ikhlāṣ",1],["Al-Anbiyāʾ 22",1],["Āyat al-Kursī",1]]]},
 {t:"Mindfulness of Allah (Murāqabah)", u:"Weeks 7–8 · Values & Manners",
  L:["Iḥsān is to worship Allah as if you see Him; and if you do not see Him, He sees you.","Knowing Allah's names Ar-Raqīb, Al-Baṣīr and As-Samīʿ helps us stay mindful.","A girl refused to water down milk, saying: “If ʿUmar doesn't see us, the Lord of ʿUmar sees us.”"],
  q:[["Why did the milk-seller's daughter refuse to cheat?",["Allah sees us","She was scared of ʿUmar","She was tired","There was no water"]],
     ["What is iḥsān?",["Worshipping Allah as if you see Him","Giving charity","Fasting Mondays","Reading quickly"]],
     ["How does murāqabah protect society?",["People do right even when no one watches","People hide more","People stop working","It doesn't"]]],
  m:[["Ar-Raqīb","The All-Watchful"],["Al-Baṣīr","The All-Seeing"],["As-Samīʿ","The All-Hearing"],["Iḥsān","Worship Allah as if you see Him"]]},
 {t:"The Sunnahs of Fiṭrah", u:"Weeks 9–10 · Acts of Worship",
  L:["The sunnahs of fiṭrah are habits of cleanliness taught by the Prophet ﷺ.","They include clipping nails, using the siwāk, trimming the moustache and washing the finger joints.","They show Islam cares about every part of life and build confidence and respect."],
  q:[["What are the sunnahs of fiṭrah about?",["Cleanliness and good appearance","Sport","Trade","Travel"]],
     ["Which is a sunnah of fiṭrah?",["Clipping the nails","Growing nails long","Skipping showers","Wearing perfume to pray only"]],
     ["What do they show about Islam?",["It covers every part of life","It only cares about prayer","Nothing","It is only for adults"]]],
  s:[["Body cleanliness","Mouth & nose cleanliness"],[["Clipping nails",0],["Removing underarm hair",0],["Washing finger joints",0],["Using the siwāk",1],["Rinsing the mouth",1],["Rinsing the nose",1]]]},
 {t:"Tayammum and Wiping over the Khuffs", u:"Weeks 11–12 · Acts of Worship",
  L:["Tayammum replaces wuḍūʾ when there is no water or it can't be used (Al-Māʾidah 6).","Strike clean earth once, then wipe the face and the hands.","Khuffs must be put on after full wuḍūʾ: wipe the top — one day and night at home, three when travelling."],
  q:[["When is tayammum allowed?",["When there is no water or it can't be used","When you're in a hurry","When it's cold","Always"]],
     ["Which part of the khuff is wiped?",["The top","The bottom","The heel","The inside"]],
     ["What do these concessions show?",["Allah's mercy makes worship easy","Worship is optional","Rules don't matter","Nothing"]]],
  o:["Make the intention","Say Bismillāh","Strike clean earth once with both hands","Wipe the face","Wipe the hands"],
  m:[["Resident","One day and night"],["Traveller","Three days and nights"],["Tayammum","When there is no water"],["Khuff","Leather sock"]]}
],
9: [
 {t:"Surah Yā-Sīn (1–12)", u:"Weeks 1–2 · The Noble Qur'an",
  L:["Allah swears by the wise Qur'an that the Prophet ﷺ is one of the messengers on a straight path.","Those who stubbornly reject are like people with iron collars, heads forced up, with barriers in front and behind.","Allah records what people do and the traces they leave behind, all in a clear register."],
  q:[["By what does Allah swear?",["The wise Qur'an","The sun","The night","The pen"]],
     ["Who benefits from the warning (verse 11)?",["Whoever follows the reminder and fears the Most Merciful unseen","Everyone automatically","Only kings","No one"]],
     ["Besides deeds, what else is recorded?",["The traces (footprints) we leave behind","Our height","Our phone numbers","Nothing"]]],
  m:[["Aghlāl","Iron collars"],["Muqmaḥūn","Heads forced up"],["Āthārahum","Their footprints"],["Imām mubīn","A clear register"],["Al-ḥakīm","Wise"]]},
 {t:"Actions Are Judged by Intentions", u:"Weeks 3–4 · Noble Hadith",
  L:["“Actions are only by intentions, and everyone will have only what they intended.”","It was narrated by ʿUmar ibn al-Khaṭṭāb.","Showing off (riyāʾ) spoils deeds. The Prophet ﷺ called it the minor shirk."],
  q:[["Who narrated this hadith?",["ʿUmar ibn al-Khaṭṭāb","Abū Hurayrah","ʿĀʾishah","Anas"]],
     ["What is riyāʾ?",["Showing off","Being shy","Being sincere","Fasting"]],
     ["The Prophet ﷺ called showing off…",["The minor shirk","A small joke","A good habit","A sunnah"]]],
  s:[["Sincere","Showing off"],[["Praying the same alone or with people",0],["Helping someone secretly",0],["Studying to benefit others",0],["Posting good deeds for likes",1],["Reciting beautifully only to be praised",1],["Giving charity to look generous",1]]]},
 {t:"Sincerity (Ikhlāṣ)", u:"Weeks 5–6 · Values & Manners",
  L:["Ikhlāṣ is doing deeds for Allah alone, not for praise.","Signs: the same deeds in private and in public, and hiding good deeds.","Shayṭān admitted he cannot mislead Allah's sincere servants (Ṣād 83). Three men trapped in a cave were saved by sincere deeds."],
  q:[["Whom did Iblīs say he cannot mislead?",["Allah's sincere servants","The rich","The young","Scholars only"]],
     ["Which is a sign of sincerity?",["The same deeds in private and public","Only doing good when watched","Asking for praise","Boasting"]],
     ["A sincere society is full of…",["Trust","Cheating","Suspicion","Lies"]]],
  o:["Three men take shelter in a cave","A rock blocks the entrance","Each asks Allah by a sincere deed","The rock moves a little each time","They walk out safely"]},
 {t:"The Blessing of Security", u:"Weeks 7–8 · Identity & Belonging",
  L:["Allah reminded Quraysh that He “fed them against hunger and made them safe from fear”.","Islamic law protects religion, life, mind, honour and wealth.","Security lets people worship, learn and build. The UAE protects it through laws, institutions and shared values."],
  q:[["In Surah Quraysh, Allah fed them and…",["made them safe from fear","made them kings","gave them gold","made them travel"]],
     ["Why does security matter?",["People can live, worship and build","It doesn't","Only for shops","Only for tourists"]],
     ["How can students help keep security?",["Respect laws and avoid spreading rumours","Share every rumour","Ignore rules","Nothing"]]],
  m:[["Protecting life","Forbidding killing"],["Protecting the mind","Forbidding intoxicants"],["Protecting wealth","Forbidding theft"],["Protecting honour","Forbidding slander"]]},
 {t:"Belief in Divine Decree", u:"Weeks 9–10 · Islamic Creed",
  L:["Belief in qaḍāʾ and qadar is the sixth pillar of īmān.","Allah knows everything, wrote it, wills it and creates it.","True trust (tawakkul) means taking the means: “Tie your camel and trust in Allah.”"],
  q:[["Which pillar of īmān is divine decree?",["The sixth","The first","The third","The fourth"]],
     ["“Tie your camel and trust in Allah” teaches…",["Take the means, then trust Allah","Don't bother","Camels are important","Trust only yourself"]],
     ["Believing in the decree brings…",["Peace of heart","Worry","Laziness","Anger"]]],
  m:[["ʿIlm","Allah knows everything"],["Kitābah","Allah wrote everything"],["Mashīʾah","Nothing happens without His will"],["Khalq","Allah creates all things"]],
  s:[["True tawakkul","False tawakkul"],[["Revising, then making duʿāʾ before an exam",0],["Seeing a doctor and trusting Allah",0],["Tying the camel",0],["Not revising and saying “it's written”",1],["Never trying anything",1]]]},
 {t:"Prayers Offered for a Reason", u:"Weeks 11–12 · Acts of Worship",
  L:["Ṣalāt al-kusūf is prayed during an eclipse: two rakʿahs, each with two standings and two rukūʿs.","Ṣalāt al-istisqāʾ asks Allah for rain.","Ṣalāt al-istikhārah asks Allah for guidance before a decision."],
  q:[["You're choosing between two universities. Which prayer?",["Istikhārah","Kusūf","Istisqāʾ","ʿĪd"]],
     ["There is a long drought. Which prayer?",["Istisqāʾ","Istikhārah","Kusūf","Witr"]],
     ["Which prayer has two rukūʿs in each rakʿah?",["The eclipse prayer","Fajr","The rain prayer","Istikhārah"]]],
  m:[["Kusūf","Eclipse prayer"],["Istisqāʾ","Prayer for rain"],["Istikhārah","Prayer for guidance"],["Two rukūʿs per rakʿah","Eclipse prayer's feature"]]}
],
10: [
 {t:"Surah Al-Ḥujurāt (1–10)", u:"Weeks 1–2 · The Noble Qur'an",
  L:["Do not put yourselves before Allah and His Messenger, or raise your voices above the Prophet's ﷺ, or your deeds may be lost.","If a sinful person brings news, verify it before acting.","If two groups of believers fight, make peace between them: the believers are brothers."],
  q:[["Someone sends you a shocking rumour. The surah says…",["Verify it before sharing","Forward it quickly","Add more details","Post it everywhere"]],
     ["Verse 10: the believers are…",["Brothers","Strangers","Rivals","Enemies"]],
     ["Raising voices above the Prophet ﷺ risks…",["Deeds being nullified","Nothing","A prize","Fame"]]],
  m:[["Lā tuqaddimū","Do not put forward"],["Taḥbaṭa","Be nullified"],["Yaghuḍḍūna","Lower (their voices)"],["Fatabayyanū","Verify"],["Al-ḥujurāt","The private rooms"]]},
 {t:"The Seven Destructive Sins", u:"Weeks 3–4 · Noble Hadith",
  L:["“Avoid the seven destructive sins”: shirk, sorcery, unjust killing, consuming ribā, consuming an orphan's wealth, fleeing the battlefield and slandering chaste women.","Shirk is the most serious.","“Allah has permitted trade and forbidden ribā” (Al-Baqarah 275)."],
  q:[["Which sin is the most serious?",["Shirk","Ribā","Fleeing the battlefield","Slander"]],
     ["Al-Baqarah 275: Allah permitted trade and forbade…",["Ribā","Fasting","Charity","Travel"]],
     ["Which is NOT one of the seven?",["Being late to class","Sorcery","Consuming an orphan's wealth","Shirk"]]],
  m:[["Ijtanibū","Avoid"],["Al-mūbiqāt","The destructive sins"],["Ribā","Usury"],["Al-muḥṣanāt","Chaste women"],["At-tawallī yawm az-zaḥf","Fleeing the battlefield"]]},
 {t:"Zakāh in Islam", u:"Weeks 5–6 · Islamic Rulings",
  L:["Zakāh is the third pillar of Islam.","On savings above the niṣāb (the value of 85 g of gold) held for a lunar year, pay 2.5%.","It goes to eight groups (At-Tawbah 60), including the poor, the needy, debtors and stranded travellers."],
  q:[["What is the zakāh rate on savings?",["2.5%","10%","20%","1%"]],
     ["You saved 10,000 AED above the niṣāb for a year. How much zakāh?",["250 AED","1,000 AED","25 AED","2,500 AED"]],
     ["How long must wealth be held?",["One lunar year","One week","Ten years","One month"]]],
  s:[["Can receive zakāh","Cannot receive zakāh"],[["The poor",0],["Debtors",0],["A stranded traveller",0],["Zakāh collectors",0],["A wealthy person",1],["Your own parents",1]]]},
 {t:"Sincere Advice (Tanāṣuḥ)", u:"Weeks 7–8 · Values & Manners",
  L:["“The religion is sincere advice (naṣīḥah).”","Give advice privately, gently, with knowledge and at the right time.","Imam al-Shāfiʿī said that advising someone in public is a kind of rebuke."],
  q:[["Complete: The religion is…",["Sincere advice","Rules only","Easy","For scholars"]],
     ["Best way to advise a friend?",["Privately and gently","In front of the class","On social media","By shouting"]],
     ["Advice in public, al-Shāfiʿī said, is…",["A kind of rebuke","Always best","Kind","Required"]]],
  s:[["Constructive advice","Public shaming"],[["Speaking in private",0],["Using kind words",0],["Suggesting a solution",0],["Choosing the right time",0],["Correcting in front of everyone",1],["Posting about it online",1],["A mocking tone",1]]]},
 {t:"The Farewell Hajj & the Prophet's ﷺ Passing", u:"Weeks 9–10 · Biography",
  L:["In 10 AH the Prophet ﷺ gave the Farewell Sermon at ʿArafah: sacred lives and wealth, ribā abolished, rights of women and equality through taqwā.","He passed away in 11 AH, aged 63.","Abū Bakr calmed the people: “Whoever worshipped Muhammad, Muhammad has died; whoever worships Allah, Allah is Ever-Living,” and recited Āl ʿImrān 144."],
  q:[["Where was the Farewell Sermon given?",["ʿArafah","Badr","Ṭāʾif","Qubāʾ"]],
     ["How old was the Prophet ﷺ when he passed away?",["63","40","50","70"]],
     ["Who calmed the Companions with Āl ʿImrān 144?",["Abū Bakr","ʿUmar","ʿAlī","Bilāl"]]],
  m:[["ʿArafah","Where the sermon was given"],["10 AH","Year of the Farewell Hajj"],["63","His age at death"],["Āl ʿImrān 144","Verse Abū Bakr recited"]]},
 {t:"Hajj", u:"Weeks 11–12 · Acts of Worship",
  L:["Hajj is the fifth pillar, once in a lifetime for those who are able.","Its pillars include iḥrām, standing at ʿArafah, ṭawāf al-ifāḍah and saʿy.","In iḥrām, perfume, cutting hair or nails and hunting are forbidden."],
  q:[["Which pillar of Islam is Hajj?",["The fifth","The first","The second","The third"]],
     ["On which day is the standing at ʿArafah?",["9th Dhul-Ḥijjah","1st Ramadan","10th Muḥarram","27th Rajab"]],
     ["Hajj is obligatory…",["Once in a lifetime for those able","Every year","Twice","Never"]]],
  s:[["Pillar of Hajj","Forbidden in iḥrām"],[["Standing at ʿArafah",0],["Ṭawāf al-ifāḍah",0],["Saʿy",0],["Iḥrām",0],["Using perfume",1],["Cutting nails",1],["Hunting",1]]],
  o:["Enter iḥrām at the mīqāt","Ṭawāf on arrival","Stand at ʿArafah (9th)","Spend the night at Muzdalifah","Stone Jamrat al-ʿAqabah (10th)","Ṭawāf al-ifāḍah"]}
],
11: [
 {t:"Surah Al-Kahf (1–8)", u:"Weeks 1–2 · The Noble Qur'an",
  L:["Praise is for Allah who sent down the Book with no crookedness — straight, warning and giving good news.","The Prophet ﷺ cared so much that he almost destroyed himself with grief over those who rejected.","Allah made the earth's adornment a test of who is best in deeds; it will become barren ground."],
  q:[["Why did Allah put adornment on the earth?",["To test who is best in deeds","For us to own forever","To make us lazy","No reason"]],
     ["What do the verses show about the Prophet ﷺ?",["His deep mercy and care for people","His anger","His wealth","His fame"]],
     ["Memorising the first ten verses of Al-Kahf protects from…",["The Dajjāl","Illness","Poverty","Exams"]]],
  m:[["ʿIwaj","Crookedness"],["Qayyiman","Upright"],["Bākhiʿun nafsak","Destroy yourself with grief"],["Zīnah","Adornment"],["Ṣaʿīdan juruzā","Barren ground"]]},
 {t:"Makkan and Madinan Qur'an", u:"Weeks 3–4 · Qur'an Sciences",
  L:["Makkan: revealed before the Hijrah. Madinan: revealed after it.","Makkan surahs focus on tawḥīd, the afterlife and stories of prophets, often with short verses.","Madinan surahs focus on laws and society, often address “O you who believe”."],
  q:[["What is the most accepted way to define Makkan?",["Revealed before the Hijrah","Revealed inside Makkah only","Short surahs","Surahs about Makkah"]],
     ["Why was the Qur'an revealed in stages?",["To strengthen the Prophet's heart and ease learning","By accident","Because of paper shortage","No reason"]],
     ["Knowing Makkan and Madinan helps us…",["Understand verses in context","Recite faster","Skip verses","Nothing"]]],
  s:[["Makkan","Madinan"],[["Focus on tawḥīd",0],["Stories of earlier prophets",0],["Short, powerful verses",0],["“O mankind…”",0],["Laws of family and trade",1],["Mentions the hypocrites",1],["“O you who believe…”",1]]]},
 {t:"Reason in Islam", u:"Weeks 5–6 · Islamic Creed",
  L:["The mind is the basis of responsibility (taklīf): a person must be sane and mature to be accountable.","The Qur'an repeatedly asks, “Will you not reason?”","Sound reason never conflicts with authentic revelation. Intoxicants are forbidden partly to protect the mind."],
  q:[["Who is accountable for religious duties?",["A sane, mature person","Everyone from birth","Only scholars","Only adults over 40"]],
     ["Forbidding intoxicants protects…",["The mind","Wealth only","Nothing","The weather"]],
     ["Sound reason and authentic revelation…",["Never truly conflict","Always clash","Are unrelated","Cancel each other"]]],
  m:[["Taklīf","Religious responsibility"],["Afalā taʿqilūn","Will you not reason?"],["ʿAql","The mind"],["Iqraʾ","Read (the first command)"]]},
 {t:"The Schools of Islamic Law", u:"Weeks 7–8 · Principles of Rulings",
  L:["The four main Sunni schools: Ḥanafī, Mālikī, Shāfiʿī and Ḥanbalī.","They grew as Islam spread, new questions arose and scholars used evidence in different ways.","The Mālikī school is the main school in the UAE. Their differences show the breadth of Sharia."],
  q:[["Which school is followed most in the UAE?",["Mālikī","Ḥanafī","Shāfiʿī","Ḥanbalī"]],
     ["Why did the schools appear?",["New issues and different methods of using evidence","Arguments over money","Politics only","Nobody knows"]],
     ["Differences between the schools show…",["The breadth and flexibility of Sharia","Islam is confusing","One is wrong","Nothing"]]],
  m:[["Abū Ḥanīfah","Ḥanafī"],["Mālik ibn Anas","Mālikī"],["Al-Shāfiʿī","Shāfiʿī"],["Aḥmad ibn Ḥanbal","Ḥanbalī"]],
  o:["Abū Ḥanīfah","Mālik ibn Anas","Al-Shāfiʿī","Aḥmad ibn Ḥanbal"]},
 {t:"Sukaynah bint al-Ḥusayn", u:"Weeks 9–10 · Biography & Figures",
  L:["Sukaynah was the daughter of al-Ḥusayn ibn ʿAlī, from the Prophet's ﷺ household.","She grew up in a home of knowledge and faith.","She was known for her eloquence and knowledge and hosted gatherings of scholars and poets in Madinah."],
  q:[["Who was Sukaynah's father?",["Al-Ḥusayn ibn ʿAlī","Abū Bakr","ʿUmar","Khālid ibn al-Walīd"]],
     ["What was she known for?",["Knowledge and eloquence","Trading camels","Leading armies","Building ships"]],
     ["In which city did she hold her gatherings?",["Madinah","Baghdad","Cairo","Damascus"]]],
  m:[["Father","Al-Ḥusayn ibn ʿAlī"],["Grandfather","ʿAlī ibn Abī Ṭālib"],["Grandmother","Fāṭimah az-Zahrāʾ"],["City","Madinah"]]},
 {t:"Human Development in Islam", u:"Weeks 11–12 · Contemporary Issues",
  L:["Allah made humans stewards (khalīfah) on earth (Al-Baqarah 30).","“He produced you from the earth and settled you in it” (Hūd 61): we are asked to develop it.","Islamic development balances body, mind, soul and society."],
  q:[["Al-Baqarah 30: Allah placed on earth a…",["Khalīfah (steward)","King","Tree","Mountain"]],
     ["What makes development in Islam distinctive?",["Balance of material and spiritual","Only money","Only buildings","Only sport"]],
     ["First step to personal growth?",["Set a clear goal","Wait","Copy others","Do nothing"]]],
  m:[["Education","Develops the mind"],["Health","Develops the body"],["Worship","Develops the soul"],["Work","Develops wealth and society"]],
  o:["Set a goal","Make a plan","Take action","Review progress","Improve"]}
],
12: [
 {t:"Surah Al-Aḥzāb (1–8)", u:"Weeks 1–2 · Qur'an & Its Sciences",
  L:["The Prophet ﷺ is told to fear Allah, follow the revelation and rely on Him.","The surah ended ẓihār and adoption as a change of lineage: call children by their fathers' names.","There is no blame for honest mistakes, only for what hearts intend. The Prophet's wives are the Mothers of the Believers."],
  q:[["Adopted children should be called by…",["Their real fathers' names","Any name","Their adoptive father's name","Numbers"]],
     ["There is no blame for…",["Honest mistakes","Deliberate wrong","Lies","Cheating"]],
     ["Who are the Mothers of the Believers?",["The Prophet's ﷺ wives","All women","The Companions' mothers","Teachers"]]],
  m:[["Tuẓāhirūn","Declaring ẓihār"],["Adʿiyāʾakum","Your adopted sons"],["Junāḥ","Blame"],["Mīthāq","Covenant"],["Ummahātuhum","Their mothers"]]},
 {t:"Reason and Revelation", u:"Weeks 3–4 · Islamic Creed",
  L:["Revelation guides reason, and reason is the tool for understanding revelation.","The Qur'an challenges the mind: produce a surah like it (Al-Baqarah 23).","The mind strays through desires, blind imitation, arrogance and ignorance."],
  q:[["What is the challenge in Al-Baqarah 23?",["Produce one surah like it","Count the stars","Fast for a year","Build a tower"]],
     ["What is reason's role with revelation?",["To understand and apply it","To replace it","To ignore it","Nothing"]],
     ["Which leads the mind astray?",["Following desires","Seeking knowledge","Reflection","Humility"]]],
  s:[["Leads the mind astray","Protects the mind"],[["Following desires",0],["Blind imitation",0],["Arrogance",0],["Seeking knowledge",1],["Reflection",1],["A sincere intention",1]]]},
 {t:"Chastity and Self-Restraint (Isti'fāf)", u:"Weeks 5–6 · Values & Manners",
  L:["Isti'fāf is restraining yourself from what is forbidden and from depending on others.","“Whoever seeks to be chaste, Allah will make him chaste.”","It applies to the gaze, speech, money and online life, and brings dignity and trust."],
  q:[["Complete: Whoever seeks to be chaste…",["Allah will make him chaste","will be lonely","will be rich","will be famous"]],
     ["Which is isti'fāf with money?",["Not asking people when you can work","Borrowing without need","Begging","Gambling"]],
     ["A society with isti'fāf has more…",["Dignity and trust","Problems","Fear","Rumours"]]],
  s:[["Shows isti'fāf","Goes against it"],[["Lowering the gaze",0],["Clean speech online",0],["Working instead of asking",0],["Choosing good friends",0],["Scrolling inappropriate content",1],["Begging when able to work",1]]]},
 {t:"The Qur'an and Scientific Miracles", u:"Weeks 7–8 · Qur'an & Its Sciences",
  L:["A scientific miracle is a Qur'anic statement matching an established fact that could not have been known at the time.","Scientific interpretation (tafsīr ʿilmī) uses science to explain verses and may rely on theories.","Only established facts should be used, without forcing the meaning of a verse."],
  q:[["What is the difference between them?",["Miracles use established facts; interpretation may use theories","There is none","Interpretation is always certain","Miracles use guesses"]],
     ["Which rule should we follow?",["Use only established facts","Use any internet claim","Change the verse","Ignore context"]],
     ["Benefit of studying them?",["Strengthening faith and reflection","Winning arguments only","Fame","None"]]],
  m:[["Adh-Dhāriyāt 47","The expanding universe"],["Ar-Raḥmān 19–20","Barrier between two seas"],["Al-Muʾminūn 12–14","Stages of the embryo"],["An-Nabaʾ 7","Mountains as pegs"]]},
 {t:"Sources of Islamic Legislation", u:"Weeks 9–10 · Islamic Rulings",
  L:["The agreed sources: the Qur'an, the Sunnah, consensus (ijmāʿ) and analogy (qiyās).","“Whoever obeys the Messenger has obeyed Allah” (An-Nisāʾ 80).","Ijtihād lets scholars answer new questions today."],
  q:[["Drugs are forbidden by analogy with wine. Which source is this?",["Qiyās","Ijmāʿ","ʿUrf","None"]],
     ["Which verse proves the Sunnah's authority?",["An-Nisāʾ 80","Al-Fīl 1","Al-Kawthar 1","An-Nās 1"]],
     ["Why does ijtihād matter today?",["To answer new issues","To change the Qur'an","To avoid rules","It doesn't"]]],
  m:[["Qur'an","The first, preserved source"],["Sunnah","The Prophet's sayings, actions and approvals"],["Ijmāʿ","Scholars' consensus"],["Qiyās","Analogy"]],
  o:["The Qur'an","The Sunnah","Ijmāʿ","Qiyās"]},
 {t:"Planning in the Life of the Prophet ﷺ", u:"Weeks 11–12 · Biography",
  L:["The Hijrah was carefully planned: ʿAlī slept in the Prophet's bed and they hid in the Cave of Thawr for three days.","Asmāʾ brought food, ʿAbdullāh ibn Abī Bakr brought news and ʿĀmir ibn Fuhayrah covered their tracks with sheep.","ʿAbdullāh ibn Urayqiṭ was hired as a skilled guide. Lesson: plan and take the means, then rely on Allah."],
  q:[["Where did they hide for three days?",["Cave of Thawr","Cave of Ḥirāʾ","Ṭāʾif","Qubāʾ"]],
     ["Main lesson of the Hijrah planning?",["Take the means, then rely on Allah","Plans don't matter","Rely only on yourself","Travel alone"]],
     ["Why was ʿAbdullāh ibn Urayqiṭ hired?",["He was a skilled guide","He was rich","He was a poet","He was a cook"]]],
  m:[["ʿAlī","Slept in the Prophet's bed"],["Asmāʾ bint Abī Bakr","Brought food"],["ʿĀmir ibn Fuhayrah","Covered the tracks with sheep"],["ʿAbdullāh ibn Urayqiṭ","The hired guide"],["ʿAbdullāh ibn Abī Bakr","Brought news from Makkah"]]}
],
